- defaults:
    clean:
      force: true
    link:
      create: true
      relink: true
      force: true
    shell:
      stdout: true
      stderr: true
      stdin: true
- clean: ["~", "~/.config", "~/Library/Application Support"]
- link:
    ~/.config/aerospace:
      path: apps/aerospace
      if: "[ `uname` = Darwin ]"
    ~/.config/atuin: tui/atuin
    ~/.config/bat: tui/bat
    ~/.config/borders:
      path: apps/borders
      if: "[ `uname` = Darwin ]"
    ~/.config/btop: tui/btop
    ~/.config/carapace: tui/carapace
    ~/.config/glow: tui/glow
    ~/.config/cava: tui/cava
    ~/.config/dust: tui/dust
    ~/.config/eza: tui/eza
    ~/.config/fastfetch: tui/fastfetch
    ~/.config/fish: shells/fish
    ~/.config/fsh: shells/fsh
    ~/.config/git: tui/git
    ~/.config/gitui: tui/gitui
    ~/.config/ghostty: apps/ghostty
    ~/.config/helix: tui/helix
    ~/.config/karabiner:
      path: apps/karabiner
      if: "[ `uname` = Darwin ]"
    ~/.config/kitty: apps/kitty
    ~/.config/lazygit: tui/lazygit
    ~/.config/lla: tui/lla
    ~/.config/mpd: tui/mpd
    ~/.config/nnn: tui/nnn
    ~/.config/neovide: apps/neovide
    ~/.config/nushell: shells/nushell
    ~/.config/nvim: tui/nvim
    ~/.config/ohmyposh: shells/ohmyposh
    ~/.config/procs: tui/procs
    ~/.config/qutebrowser: apps/qutebrowser
    ~/.config/rmpc: tui/rmpc
    ~/.config/scooter: tui/scooter
    ~/.config/sketchybar:
      path: apps/sketchybar
      if: "[ `uname` = Darwin ]"
    ~/.config/skhd:
      path: apps/skhd
      if: "[ `uname` = Darwin ]"
    ~/.config/television: tui/television
    ~/.config/tig: tui/tig
    ~/.config/tmux: tui/tmux
    ~/.config/vscode/markdown-preview-enhanced: apps/vscode/markdown-preview-enhanced
    ~/.config/wezterm: apps/wezterm
    ~/.config/yabai:
      path: apps/yabai
      if: "[ `uname` = Darwin ]"
    ~/.config/yazi: tui/yazi
    ~/.config/zellij: tui/zellij
    ~/.config/starship.toml: shells/starship.toml
    ~/.ssh: cli/ssh
    ~/.config/todo: cli/todo
    ~/.zshrc: shells/zshrc/.zshrc
    ~/.p10k.zsh: cli/p10k/.p10k.zsh
    # MacOS specific configurations
    ~/Library/Application Support/Code/User/settings.json:
      path: apps/vscode/settings.json
      if: "[ `uname` = Darwin ]"
    ~/Library/Application Support/Code/User/keybindings.json:
      path: apps/vscode/keybindings.json
      if: "[ `uname` = Darwin ]"
    ~/Library/Application Support/Code/User/snippets:
      path: apps/vscode/snippets
      if: "[ `uname` = Darwin ]"
    # Linux (omarchy) VS Code configurations
    ~/.config/Code/User/settings.json:
      path: apps/vscode/settings.json
      if: "[ `uname` = Linux ]"
    ~/.config/Code/User/keybindings.json:
      path: apps/vscode/keybindings.json
      if: "[ `uname` = Linux ]"
    ~/.config/Code/User/snippets:
      path: apps/vscode/snippets
      if: "[ `uname` = Linux ]"
    # omarchy-shell: свои плагины (бар со скинами, меню, Customizer)
    ~/.config/omarchy/plugins/kamradsmeshnyavy.bar:
      path: apps/omarchy-shell/plugins/kamradsmeshnyavy.bar
      if: "[ `uname` = Linux ]"
    ~/.config/omarchy/plugins/kamradsmeshnyavy.menu:
      path: apps/omarchy-shell/plugins/kamradsmeshnyavy.menu
      if: "[ `uname` = Linux ]"
    ~/.config/omarchy/plugins/kamradsmeshnyavy.customizer:
      path: apps/omarchy-shell/plugins/kamradsmeshnyavy.customizer
      if: "[ `uname` = Linux ]"
    # Linux (omarchy) theme sync: Dark Reader + Stylus follow the omarchy theme
    ~/.config/omarchy/hooks/theme-set:
      path: omarchy-themes/hooks/theme-set
      if: "[ `uname` = Linux ]"
    ~/.config/omarchy/hooks/post-boot.d/darkreader-sync:
      path: omarchy-themes/hooks/post-boot.d/darkreader-sync
      if: "[ `uname` = Linux ]"
    ~/.local/bin/helium-browser:
      path: omarchy-themes/scripts/helium-browser
      if: "[ `uname` = Linux ]"
    ~/.config/systemd/user/omarchy-stylus-server.service:
      path: omarchy-themes/systemd/omarchy-stylus-server.service
      if: "[ `uname` = Linux ]"
    ~/.config/omarchy/themes/catppuccin-mocha-lavender:
      path: omarchy-themes/catppuccin-mocha-lavender
      if: "[ `uname` = Linux ]"
    ~/.config/omarchy/themes/catppuccin-mocha-efter:
      path: omarchy-themes/catppuccin-mocha-efter
      if: "[ `uname` = Linux ]"
    # Linux (omarchy): Hyprland, ввод, браузеры, TUI — раньше ставились вручную
    ~/.config/hypr:
      path: apps/hyprland
      if: "[ `uname` = Linux ]"
    ~/.config/swaync:
      path: apps/swaync
      if: "[ `uname` = Linux ]"
    ~/.config/rofi:
      path: apps/rofi
      if: "[ `uname` = Linux ]"
    ~/.config/wl-kbptr:
      path: apps/wl-kbptr
      if: "[ `uname` = Linux ]"
    ~/.config/mouseless:
      path: apps/mouseless
      if: "[ `uname` = Linux ]"
    ~/.config/kanata:
      path: apps/kanata
      if: "[ `uname` = Linux ]"
    ~/.config/chromium-flags.conf:
      path: apps/browser/chromium-flags.conf
      if: "[ `uname` = Linux ]"
    ~/.config/helium-browser-flags.conf:
      path: apps/browser/configs/helium/helium-flags.conf
      if: "[ `uname` = Linux ]"
    ~/.config/tridactyl:
      path: apps/browser/configs/tridactyl
      if: "[ `uname` = Linux ]"
    ~/.config/jolt:
      path: tui/jolt
      if: "[ `uname` = Linux ]"
    ~/.config/ncmpcpp:
      path: tui/ncmpcpp
      if: "[ `uname` = Linux ]"
    ~/.config/spotify-player:
      path: tui/spotify-player
      if: "[ `uname` = Linux ]"
    # Linux: свои скрипты в ~/.local/bin
    ~/.local/bin/omarchy-bg-browser:
      path: scripts/bin/omarchy-bg-browser
      if: "[ `uname` = Linux ]"
    ~/.local/bin/omarchy-customizer:
      path: scripts/bin/omarchy-customizer
      if: "[ `uname` = Linux ]"
    ~/.local/bin/yazi-dbus-filemanager.py:
      path: scripts/bin/yazi-dbus-filemanager.py
      if: "[ `uname` = Linux ]"
    ~/.local/bin/yazi-fm-dbus.py:
      path: scripts/bin/yazi-fm-dbus.py
      if: "[ `uname` = Linux ]"
    # Темы Omarchy из omarchy-themes/
    ~/.config/omarchy/themes/black-arch-my-vision:
      path: omarchy-themes/black-arch-my-vision
      if: "[ `uname` = Linux ]"
    ~/.config/omarchy/themes/black-arch-pastel:
