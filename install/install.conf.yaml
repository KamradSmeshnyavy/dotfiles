    ~/.config/omarchy/themes/pastel-hacker-pink:
      path: omarchy-themes/pastel-hacker-variants/pastel-hacker-pink
      if: "[ `uname` = Linux ]"
    ~/.config/omarchy/themes/pastel-hacker-red:
      path: omarchy-themes/pastel-hacker-variants/pastel-hacker-red
      if: "[ `uname` = Linux ]"
    ~/.config/omarchy/themes/pastel-hacker-silver:
      path: omarchy-themes/pastel-hacker-variants/pastel-hacker-silver
      if: "[ `uname` = Linux ]"
    ~/.config/omarchy/themes/pastel-hacker-yellow:
      path: omarchy-themes/pastel-hacker-variants/pastel-hacker-yellow
      if: "[ `uname` = Linux ]"
    ~/.config/omarchy/themes/pastel-hacker24:
      path: omarchy-themes/pastel-hacker24
      if: "[ `uname` = Linux ]"
    ~/.config/omarchy/themes/pastel-hacker24-blue:
      path: omarchy-themes/pastel-hacker-variants/pastel-hacker24-blue
      if: "[ `uname` = Linux ]"
    ~/.config/omarchy/themes/pastel-hacker24-cyan:
      path: omarchy-themes/pastel-hacker-variants/pastel-hacker24-cyan
