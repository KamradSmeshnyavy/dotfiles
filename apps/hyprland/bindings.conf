# Application bindings
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" bash -c "tmux attach || tmux new -s Work"
bindd = SUPER SHIFT, RETURN, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, uwsm-app -- nautilus --new-window "$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, B, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, omarchy-launch-browser --private
bindd = SUPER SHIFT, M, Music, exec, omarchy-launch-or-focus spotify
bindd = SUPER SHIFT ALT, M, Music TUI, exec, omarchy-launch-or-focus-tui cliamp
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = SUPER SHIFT, G, Signal, exec, omarchy-launch-or-focus ^signal$ "uwsm-app -- signal-desktop"
bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus ^obsidian$ "uwsm-app -- obsidian"
bindd = SUPER SHIFT, W, Typora, exec, uwsm-app -- typora --enable-wayland-ime
bindd = SUPER SHIFT, SLASH, Passwords, exec, uwsm-app -- bw



# ╭───────────────────────────────────────────────────────╮
# │      ИТОГОВЫЙ БЛОК ПОЛЬЗОВАТЕЛЬСКИХ НАСТРОЕК          │
# ╰───────────────────────────────────────────────────────╯

# Управление музыкой через Fn-комбинации ThinkPad. FN+P, FN+S, FN+B
bindl = , Pause,   exec, playerctl play-pause #FN+P
bindl = , Scroll_Lock, exec, playerctl next # FN+K
bindl = , Break,       exec, playerctl previous # DOESNT WORK

#  Вызов шпаргалки по биндам (теперь на Super + CTRL + ;)
bindd = SUPER CTRL, semicolon, Keybindings Cheatsheet, exec, omarchy-menu-keybindings

# Разделение окон Togglesplit (теперь на Super + S)
unbind = SUPER, S
bindd = SUPER, S, Toggle window split, layoutmsg, togglesplit

# Toggle layout
bindd = SUPER, semicolon, Toggle workspace layout, exec, omarchy-hyprland-workspace-layout-toggle
# Scratchpad

unbind = SUPER, D
unbind = SUPER SHIFT, D
unbind = SUPER CTRL, D

bind = SUPER CONTROL, D, movetoworkspace, +0
bindd = SUPER SHIFT, D, Move window to scratchpad, movetoworkspacesilent, special:scratchpad
bindd = SUPER, D, Toggle scratchpad, togglespecialworkspace, scratchpad


# Перемещение фокуса между окнами (Super + HJKL)
unbind = SUPER, H
unbind = SUPER, J
unbind = SUPER, K
unbind = SUPER, L

# # Move focus with SUPER + arrow keys
# bindd = SUPER, H, Focus on left window, movefocus, l
# bindd = SUPER, L, Focus on right window, movefocus, r
# bindd = SUPER, K, Focus on above window, movefocus, u
# bindd = SUPER, J, Focus on below window, movefocus, d

# smart_focus in everywhere
bind = SUPER, H, exec, ~/.config/hypr/scripts/smart_focus.sh l
bind = SUPER, L, exec, ~/.config/hypr/scripts/smart_focus.sh r
bind = SUPER, K, exec, ~/.config/hypr/scripts/smart_focus.sh u
bind = SUPER, J, exec, ~/.config/hypr/scripts/smart_focus.sh d

# Swap active window with the one next to it with SUPER + SHIFT + arrow keys
bindd = SUPER SHIFT, H, Swap window to the left, swapwindow, l
bindd = SUPER SHIFT, L, Swap window to the right, swapwindow, r
bindd = SUPER SHIFT, K, Swap window up, swapwindow, u
bindd = SUPER SHIFT, J, Swap window down, swapwindow, d

# Resize active window
unbind = SUPER CTRL, H
unbind = SUPER CTRL, J
unbind = SUPER CTRL, K
unbind = SUPER CTRL, L
bindd = SUPER CTRL, H, Expand window left, resizeactive, -100 0    # - key
bindd = SUPER CTRL, L, Shrink window left, resizeactive, 100 0     # = key
bindd = SUPER CTRL, K, Shrink window up, resizeactive, 0 -100
bindd = SUPER CTRL, J, Expand window down, resizeactive, 0 100

bind = SUPER, R, submap, resize

submap = resize

binde = , L, resizeactive, 20 0
binde = , H, resizeactive, -20 0
binde = , K, resizeactive, 0 -20
binde = , J, resizeactive, 0 20

# Перемещение плавающих окон (с зажатым SHIFT)
binde = SHIFT, L, moveactive, 20 0
binde = SHIFT, H, moveactive, -20 0
binde = SHIFT, K, moveactive, 0 -20
binde = SHIFT, J, moveactive, 0 20

bind = , escape, submap, reset
bind = , return, submap, reset

submap = reset

# ╭───────────────────────────────────────────────────────╮
# │                     wl-kbptr                          │
# ╰───────────────────────────────────────────────────────╯
# Активация меток wl-kbptr вне режима курсора
bind = SUPER, I, exec, wl-kbptr -o modes=floating,click -o mode_floating.source=detect


# Разрешаем эмуляцию мыши и клавиатуры для сторонних утилит
allow_ext_workspace_control = true
# Cursor submap (similar to the Mouse mode in Sway)
submap=cursor

# Jump cursor to a position
bind=,a,exec,hyprctl dispatch submap reset && wl-kbptr && hyprctl dispatch submap cursor
# Быстрый прыжок по текстовым подсказкам (меткам)
# bind=SHIFT,f,exec,hyprctl dispatch submap reset && wl-kbptr -o modes=floating,click && hyprctl dispatch submap cursor
bind = SHIFT, f, exec, hyprctl dispatch submap reset && wl-kbptr -o modes=floating,click -o mode_floating.source=detect && hyprctl dispatch submap cursor

# Cursor movement
binde=,j,exec,wlrctl pointer move 0 10
binde=,k,exec,wlrctl pointer move 0 -10
binde=,l,exec,wlrctl pointer move 10 0
binde=,h,exec,wlrctl pointer move -10 0

# Left button
bind=,s,exec,wlrctl pointer click left
# Middle button
bind=,d,exec,wlrctl pointer click middle
# Right button
bind=,f,exec,wlrctl pointer click right

# # Scroll up and down
# binde=,e,exec,wlrctl pointer scroll 10 0
# binde=,r,exec,wlrctl pointer scroll -10 0
#
# # Scroll left and right
# binde=,t,exec,wlrctl pointer scroll 0 -10
# binde=,g,exec,wlrctl pointer scroll 0 10

bindel = , e, exec, wlrctl pointer scroll 10 0
bindel = , r, exec, wlrctl pointer scroll -10 0
bindel = , t, exec, wlrctl pointer scroll 0 -10
bindel = , g, exec, wlrctl pointer scroll 0 10


# Exit cursor submap
# If you do not use cursor timeout or cursor:hide_on_key_press, you can delete its respective calls.
bind=,escape,exec,hyprctl keyword cursor:inactive_timeout 3; hyprctl keyword cursor:hide_on_key_press true; hyprctl dispatch submap reset 

submap = reset

# Entrypoint
# If you do not use cursor timeout or cursor:hide_on_key_press, you can delete its respective calls.
bind=SUPER SHIFT,I,exec,hyprctl keyword cursor:inactive_timeout 0; hyprctl keyword cursor:hide_on_key_press false; hyprctl dispatch submap cursor

# Управление колонками в макете scrolling (вертикальные стеки)
bind = SUPER, Period, layoutmsg, consume
bind = SUPER SHIFT, Period, layoutmsg, expel

# =====================================================================
# Быстрый браузер-панель "как в WaveTerm" (SUPER + N)
# =====================================================================
bind = SUPER, N, exec, ~/.config/hypr/scripts/quick_browser.sh

# =====================================================================
# Умное переключение фокуса Float <-> Tiled (SUPER + TAB)
# Отменяем предыдущие привязки SUPER + TAB, если были
unbind = SUPER, TAB
bind = SUPER, TAB, exec, ~/.config/hypr/scripts/focus_float_toggle.sh

# --- JaKooLit Style Keybinds ---
# Unbind default walker/omarchy menu if any
unbind = SUPER, SPACE
bind = SUPER, SPACE, exec, pkill rofi || rofi -show drun -modi "drun,filebrowser,window,clipboard:~/.config/hypr/scripts/rofi-cliphist.sh,websearch:~/.config/hypr/scripts/rofi-websearch.sh"

# Clipboard Manager with Rofi
# unbind = SUPER, V
# bind = SUPER, V, exec, pkill rofi || cliphist list | rofi -dmenu | cliphist decode | wl-copy

# Emojis
bind = SUPER ALT, E, exec, ~/.config/hypr/scripts/RofiEmoji.sh

# Rofi Beats (Lo-Fi)
unbind = SUPER ALT, M
bind = SUPER ALT, M, exec, ~/.config/hypr/UserScripts/RofiBeats.sh

# Waybar Style and Layout Switcher
unbind = SUPER CTRL, W
bind = SUPER CTRL, W, exec, ~/.config/hypr/scripts/WaybarStyles.sh
bind = SUPER ALT, W, exec, ~/.config/hypr/scripts/WaybarLayout.sh

# Rofi Theme Selector
unbind = SUPER CTRL, R
bind = SUPER CTRL, R, exec, ~/.config/hypr/scripts/RofiThemeSelector.sh

# Wlogout (Power Menu)
unbind = SUPER, ESCAPE
bind = SUPER, ESCAPE, exec, ~/.config/hypr/scripts/Wlogout.sh
# bind = CTRL ALT, DELETE, exec, ~/.config/hypr/scripts/Wlogout.sh

# SwayNC (Notification Center)
# SwayNC (Notification Center) on SUPER Z
bind = SUPER, Z, exec, swaync-client -t -sw

# Theme Chooser Menu
bind = SUPER SHIFT, T, exec, ~/.config/hypr/scripts/ThemeMenu.sh
bind = SUPER ALT, SPACE, exec, omarchy-menu

# Animations
unbind = SUPER CTRL, A
bind = SUPER CTRL, A, exec, ~/.config/hypr/scripts/Animations.sh

# wiremix
bindd = SUPER ALT, A, Audio controls, exec, omarchy-launch-audio


# Reset Zoom
unbind = SUPER SHIFT ALT, Z
bindd = SUPER SHIFT CTRL, Z, Reset zoom, exec, hyprctl keyword cursor:zoom_factor 1

# Add extra bindings
# bind = SUPER SHIFT, R, exec, alacritty -e ssh your-server

