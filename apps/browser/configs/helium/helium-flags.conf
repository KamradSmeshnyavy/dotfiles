# ~/.config/helium-browser-flags.conf (читается обёрткой helium-browser)
# Замер 2026-10-14 (RAPL): флаги GPU/ANGLE/VA-API/BatterySaver выгоды не дали —
# Chromium 155 включает VA-API и GPU-растеризацию сам. Оставлено только удобство.
# Обёртка превращает пути из $HOME в буквальную ~, поэтому пути — только вне $HOME.
# Chromium учитывает лишь последний --enable-features: все фичи в одной строке.

--ozone-platform=wayland
--enable-features=TouchpadOverscrollHistoryNavigation,WaylandWindowDecorations
--load-extension=/usr/share/omarchy/default/chromium/extensions/copy-url
--disable-smooth-scrolling
