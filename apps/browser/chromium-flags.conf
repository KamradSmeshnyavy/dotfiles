--ozone-platform=wayland
--ozone-platform-hint=wayland
--enable-features=TouchpadOverscrollHistoryNavigation
--load-extension=/usr/share/omarchy/default/chromium/extensions/copy-url,/usr/share/omarchy/default/chromium/extensions/yt-dlp,/usr/share/omarchy/default/chromium/extensions/whatsapp-slim
# Идеальный нативный Wayland без прослойки XWayland
# --ozone-platform-hint=auto
--enable-features=WaylandWindowDecorations

# Безопасное и быстрое ускорение через OpenGL/EGL
--use-gl=angle
--use-angle=gl-egl

# Включение аппаратной отрисовки страниц силами Intel Arc
--enable-gpu-rasterization
--enable-oop-rasterization
--enable-zero-copy
# --enable-features=ZeroCopyRasterizer 

# Аппаратное декодирование видео (VA-API)
--enable-features=VaapiVideoDecodeLinuxGL,VaapiVideoEncoder,CanvasOopRasterization,BatterySaverModeAvailable,BatterySaverOnBattery
--ignore-gpu-blocklist

--disable-smooth-scrolling

--password-store=gnome-libsecret
