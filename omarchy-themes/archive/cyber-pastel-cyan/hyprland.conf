general {
    layout = dwindle
    gaps_in = 4
    gaps_out = 6
    border_size = 2
    col.active_border = rgba(89ddffFF) rgba(a8d8b9FF) rgba(c9b5f5FF) 45deg
    col.inactive_border = rgba(252740FF)
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.90
    dim_special = 0.3
    blur {
        enabled = true
        size = 12
        passes = 3
        new_optimizations = true
    }
    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(1a1b2eCC)
    }
}

gestures {
    gesture = 3, left, dispatcher, workspace, -1
    gesture = 3, right, dispatcher, workspace, +1
    gesture = 4, up, dispatcher, togglefloating
}
