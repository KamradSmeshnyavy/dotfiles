general {
    layout = dwindle
    gaps_in = 4
    gaps_out = 6
    border_size = 2
    col.active_border = rgba(4a9eb5FF) rgba(6bb5a7FF) rgba(9a8ad4FF) 45deg
    col.inactive_border = rgba(152836FF)
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.90
    dim_special = 0.3
    blur {
        enabled = true
        size = 10
        passes = 2
        new_optimizations = true
    }
    shadow {
        enabled = true
        range = 10
        render_power = 3
        color = rgba(0d1820CC)
    }
}

gestures {
    gesture = 3, left, dispatcher, workspace, -1
    gesture = 3, right, dispatcher, workspace, +1
    gesture = 4, up, dispatcher, togglefloating
}
