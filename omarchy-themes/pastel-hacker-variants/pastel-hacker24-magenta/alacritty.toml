[window]
padding.x = 20
padding.y = 20
decorations = "none"

[font]
size = 12.0

[colors.primary]
foreground = "#dcd7e6"
background = "#0d0e1a"

[colors.selection]
text = "#0d0e1a"
background = "#c9a0dc"

[colors.cursor]
text = "#0d0e1a"
cursor = "#c9a0dc"

[colors.normal]
black   = "#0d0e1a"
red     = "#f1948a"
green   = "#c9a0dc"
yellow  = "#f5cba7"
blue    = "#c9a0dc"
magenta = "#c9a0dc"
cyan    = "#8dd4cc"
white   = "#dcd7e6"

[colors.bright]
black   = "#4a4d6a"
red     = "#f1948a"
green   = "#c9a0dc"
yellow  = "#f5cba7"
blue    = "#c9a0dc"
magenta = "#c9a0dc"
cyan    = "#8dd4cc"
white   = "#ffffff"
