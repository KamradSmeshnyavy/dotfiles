general {
    layout = dwindle
    gaps_in = 4
    gaps_out = 6
    border_size = 2
    col.active_border = rgba(f5b7b1FF) rgba(8dd4ccFF) rgba(c9a0dcFF) 45deg
    col.inactive_border = rgba(151726FF)
}

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 0.88
    dim_special = 0.4
    blur {
        enabled = true
        size = 8
        passes = 2
        new_optimizations = true
    }
    shadow {
        enabled = true
        range = 10
        render_power = 3
        color = rgba(0d0e1aCC)
    }
}

gestures {
    gesture = 3, left, dispatcher, workspace, -1
    gesture = 3, right, dispatcher, workspace, +1
    gesture = 4, up, dispatcher, togglefloating
}
