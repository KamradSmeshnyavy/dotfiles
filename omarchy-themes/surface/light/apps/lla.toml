name = "omarchy"
author = "Mohamed Achaq"
description = "A soothing pastel theme for the high-spirited, featuring warm, cozy colors"

[colors]
file = "#252e33"
directory = "#32403f"
symlink = "#4f6b5b"
executable = "#3c5049"

size = "#848584"
date = "#848584"
user = "#bb3c3e"
group = "#848584"

permission_dir = "#32403f"
permission_read = "#3c5049"
permission_write = "#bb3c3e"
permission_exec = "#bb3c3e"
permission_none = "#848584"

[special_files]
[special_files.folders]
"node_modules" = { h = 0, s = 0, l = 0.15 }
"target" = "#848584"
"dist" = "#848584"
".git" = "#32403f"
"build" = "#848584"
".cache" = "#848584"
"*-env" = "#3c5049"
"venv" = "#3c5049"
".env" = "#3c5049"
"*.d" = "#4f6b5b"
"*_cache" = "#848584"
"*-cache" = "#848584"

[special_files.dotfiles]
".gitignore" = "#546670"
".env" = "#32403f"
".dockerignore" = "#546670"
".editorconfig" = "#546670"
".prettierrc" = "#546670"
".eslintrc" = "#546670"
".babelrc" = "#546670"

[special_files.exact_match]
"Dockerfile" = "#546670"
"docker-compose.yml" = "#546670"
"Makefile" = "#bb3c3e"
"CMakeLists.txt" = "#bb3c3e"
"README.md" = "#32403f"
"LICENSE" = "#32403f"
"package.json" = "#32403f"
"Cargo.toml" = "#bb3c3e"
"go.mod" = "#546670"
"flake.nix" = "#32403f"
"flake.lock" = "#848584"
"shell.nix" = "#32403f"
"default.nix" = "#32403f"

[special_files.patterns]
"*rc" = "#546670"
"*.min.*" = "#848584"
"*.test.*" = "#3c5049"
"*.spec.*" = "#3c5049"
"*.lock" = "#848584"
"*.config.*" = "#546670"

[extensions.groups]
rust = ["rs", "toml"]
python = ["py", "pyi", "pyw", "ipynb"]
javascript = ["js", "mjs", "cjs", "jsx"]
typescript = ["ts", "tsx", "d.ts"]
java = ["java", "jar", "class"]
csharp = ["cs", "csx"]
cpp = ["cpp", "cc", "cxx", "c++", "hpp", "hxx", "h++"]
go = ["go"]
ruby = ["rb", "erb"]
php = ["php", "phtml"]
swift = ["swift"]
kotlin = ["kt", "kts"]
nix = ["nix"]

markup = ["html", "htm", "xhtml", "xml", "svg", "vue", "wasm", "ejs"]
style = ["css", "scss", "sass", "less", "styl"]
web_config = ["json", "json5", "yaml", "yml", "toml", "ini", "conf", "config"]

shell = ["sh", "bash", "zsh", "fish", "ps1", "psm1", "psd1"]
script = ["pl", "pm", "t", "tcl", "lua", "vim", "vimrc", "r"]

doc = [
  "md",
  "rst",
  "txt",
  "org",
  "wiki",
  "adoc",
  "tex",
  "pdf",
  "epub",
  "doc",
  "docx",
  "rtf",
]

image = ["png", "jpg", "jpeg", "gif", "bmp", "tiff", "webp", "ico", "heic"]
video = ["mp4", "webm", "mov", "avi", "mkv", "flv", "wmv", "m4v", "3gp"]
audio = ["mp3", "wav", "ogg", "m4a", "flac", "aac", "wma"]

data = ["csv", "tsv", "sql", "sqlite", "db", "json", "xml", "yaml", "yml"]
archive = ["zip", "tar", "gz", "bz2", "xz", "7z", "rar", "iso", "dmg"]

[extensions.colors]
rust = "#bb3c3e"
python = "#3c5049"
javascript = "#252e33"
typescript = "#546670"
java = "#bb3c3e"
csharp = "#3c5049"
cpp = "#bb3c3e"
go = "#546670"
ruby = "#bb3c3e"
php = "#3c5049"
swift = "#bb3c3e"
kotlin = "#3c5049"
nix = "#546670"

markup = "#bb3c3e"
style = "#3c5049"
web_config = "#32403f"

shell = "#3c5049"
script = "#32403f"

doc = "#252e33"

image = "#4a6b70"
video = "#4a6b70"
audio = "#4a6b70"

data = "#32403f"
archive = "#bb3c3e"

rs = "#bb3c3e"
py = "#3c5049"
js = "#252e33"
ts = "#546670"
jsx = "#252e33"
tsx = "#546670"
vue = "#3c5049"
css = "#3c5049"
scss = "#3c5049"
html = "#bb3c3e"
md = "#252e33"
json = "#32403f"
yaml = "#32403f"
toml = "#32403f"
sql = "#546670"
