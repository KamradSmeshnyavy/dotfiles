name = "omarchy"
author = "Mohamed Achaq"
description = "A soothing pastel theme for the high-spirited, featuring warm, cozy colors"

[colors]
file = "#e5dfc5"
directory = "#83b6af"
symlink = "#b06d6d"
executable = "#7aa265"

size = "#727166"
date = "#727166"
user = "#d39bb6"
group = "#727166"

permission_dir = "#83b6af"
permission_read = "#7aa265"
permission_write = "#d39bb6"
permission_exec = "#e67e80"
permission_none = "#727166"

[special_files]
[special_files.folders]
"node_modules" = { h = 0, s = 0, l = 0.15 }
"target" = "#727166"
"dist" = "#727166"
".git" = "#83b6af"
"build" = "#727166"
".cache" = "#727166"
"*-env" = "#7aa265"
"venv" = "#7aa265"
".env" = "#7aa265"
"*.d" = "#b06d6d"
"*_cache" = "#727166"
"*-cache" = "#727166"

[special_files.dotfiles]
".gitignore" = "#87c095"
".env" = "#83b6af"
".dockerignore" = "#87c095"
".editorconfig" = "#87c095"
".prettierrc" = "#87c095"
".eslintrc" = "#87c095"
".babelrc" = "#87c095"

[special_files.exact_match]
"Dockerfile" = "#87c095"
"docker-compose.yml" = "#87c095"
"Makefile" = "#e67e80"
"CMakeLists.txt" = "#e67e80"
"README.md" = "#83b6af"
"LICENSE" = "#83b6af"
"package.json" = "#83b6af"
"Cargo.toml" = "#e67e80"
"go.mod" = "#87c095"
"flake.nix" = "#83b6af"
"flake.lock" = "#727166"
"shell.nix" = "#83b6af"
"default.nix" = "#83b6af"

[special_files.patterns]
"*rc" = "#87c095"
"*.min.*" = "#727166"
"*.test.*" = "#7aa265"
"*.spec.*" = "#7aa265"
"*.lock" = "#727166"
"*.config.*" = "#87c095"

[extensions.groups]
rust = ["rs", "toml"]
python = ["py", "pyi", "pyw", "ipynb"]
javascript = ["js", "mjs", "cjs", "jsx"]
typescript = ["ts", "tsx", "d.ts"]
java = ["java", "jar", "class"]
csharp = ["cs", "csx"]
cpp = ["cpp", "cc", "cxx", "c++", "hpp", "hxx", "h++"]
go = ["go"]
ruby = ["rb", "erb"]
php = ["php", "phtml"]
swift = ["swift"]
kotlin = ["kt", "kts"]
nix = ["nix"]

markup = ["html", "htm", "xhtml", "xml", "svg", "vue", "wasm", "ejs"]
style = ["css", "scss", "sass", "less", "styl"]
web_config = ["json", "json5", "yaml", "yml", "toml", "ini", "conf", "config"]

shell = ["sh", "bash", "zsh", "fish", "ps1", "psm1", "psd1"]
script = ["pl", "pm", "t", "tcl", "lua", "vim", "vimrc", "r"]

doc = [
  "md",
  "rst",
  "txt",
  "org",
  "wiki",
  "adoc",
  "tex",
  "pdf",
  "epub",
  "doc",
  "docx",
  "rtf",
]

image = ["png", "jpg", "jpeg", "gif", "bmp", "tiff", "webp", "ico", "heic"]
video = ["mp4", "webm", "mov", "avi", "mkv", "flv", "wmv", "m4v", "3gp"]
audio = ["mp3", "wav", "ogg", "m4a", "flac", "aac", "wma"]

data = ["csv", "tsv", "sql", "sqlite", "db", "json", "xml", "yaml", "yml"]
archive = ["zip", "tar", "gz", "bz2", "xz", "7z", "rar", "iso", "dmg"]

[extensions.colors]
rust = "#e67e80"
python = "#7aa265"
javascript = "#d9bb80"
typescript = "#87c095"
java = "#e67e80"
csharp = "#7aa265"
cpp = "#e67e80"
go = "#87c095"
ruby = "#e67e80"
php = "#7aa265"
swift = "#e67e80"
kotlin = "#7aa265"
nix = "#87c095"

markup = "#d39bb6"
style = "#7aa265"
web_config = "#83b6af"

shell = "#7aa265"
script = "#83b6af"

doc = "#e5dfc5"

image = "#d39bb6"
video = "#d39bb6"
audio = "#d39bb6"

data = "#83b6af"
archive = "#e67e80"

rs = "#e67e80"
py = "#7aa265"
js = "#d9bb80"
ts = "#87c095"
jsx = "#d9bb80"
tsx = "#87c095"
vue = "#7aa265"
css = "#7aa265"
scss = "#7aa265"
html = "#d39bb6"
md = "#e5dfc5"
json = "#83b6af"
yaml = "#83b6af"
toml = "#83b6af"
sql = "#87c095"
