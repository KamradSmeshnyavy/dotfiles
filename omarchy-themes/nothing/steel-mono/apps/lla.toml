name = "omarchy"
author = "Mohamed Achaq"
description = "A soothing pastel theme for the high-spirited, featuring warm, cozy colors"

[colors]
file = "#dde3e8"
directory = "#dde3e8"
symlink = "#ff4d55"
executable = "#a8b2ba"

size = "#5f6a74"
date = "#5f6a74"
user = "#b8cfe2"
group = "#5f6a74"

permission_dir = "#dde3e8"
permission_read = "#a8b2ba"
permission_write = "#b8cfe2"
permission_exec = "#ff4d55"
permission_none = "#5f6a74"

[special_files]
[special_files.folders]
"node_modules" = { h = 0, s = 0, l = 0.15 }
"target" = "#5f6a74"
"dist" = "#5f6a74"
".git" = "#dde3e8"
"build" = "#5f6a74"
".cache" = "#5f6a74"
"*-env" = "#a8b2ba"
"venv" = "#a8b2ba"
".env" = "#a8b2ba"
"*.d" = "#ff4d55"
"*_cache" = "#5f6a74"
"*-cache" = "#5f6a74"

[special_files.dotfiles]
".gitignore" = "#b3bbc3"
".env" = "#dde3e8"
".dockerignore" = "#b3bbc3"
".editorconfig" = "#b3bbc3"
".prettierrc" = "#b3bbc3"
".eslintrc" = "#b3bbc3"
".babelrc" = "#b3bbc3"

[special_files.exact_match]
"Dockerfile" = "#b3bbc3"
"docker-compose.yml" = "#b3bbc3"
"Makefile" = "#ff4d55"
"CMakeLists.txt" = "#ff4d55"
"README.md" = "#dde3e8"
"LICENSE" = "#dde3e8"
"package.json" = "#dde3e8"
"Cargo.toml" = "#ff4d55"
"go.mod" = "#b3bbc3"
"flake.nix" = "#dde3e8"
"flake.lock" = "#5f6a74"
"shell.nix" = "#dde3e8"
"default.nix" = "#dde3e8"

[special_files.patterns]
"*rc" = "#b3bbc3"
"*.min.*" = "#5f6a74"
"*.test.*" = "#a8b2ba"
"*.spec.*" = "#a8b2ba"
"*.lock" = "#5f6a74"
"*.config.*" = "#b3bbc3"

[extensions.groups]
rust = ["rs", "toml"]
python = ["py", "pyi", "pyw", "ipynb"]
javascript = ["js", "mjs", "cjs", "jsx"]
typescript = ["ts", "tsx", "d.ts"]
java = ["java", "jar", "class"]
csharp = ["cs", "csx"]
cpp = ["cpp", "cc", "cxx", "c++", "hpp", "hxx", "h++"]
go = ["go"]
ruby = ["rb", "erb"]
php = ["php", "phtml"]
swift = ["swift"]
kotlin = ["kt", "kts"]
nix = ["nix"]

markup = ["html", "htm", "xhtml", "xml", "svg", "vue", "wasm", "ejs"]
style = ["css", "scss", "sass", "less", "styl"]
web_config = ["json", "json5", "yaml", "yml", "toml", "ini", "conf", "config"]

shell = ["sh", "bash", "zsh", "fish", "ps1", "psm1", "psd1"]
script = ["pl", "pm", "t", "tcl", "lua", "vim", "vimrc", "r"]

doc = [
  "md",
  "rst",
  "txt",
  "org",
  "wiki",
  "adoc",
  "tex",
  "pdf",
  "epub",
  "doc",
  "docx",
  "rtf",
]

image = ["png", "jpg", "jpeg", "gif", "bmp", "tiff", "webp", "ico", "heic"]
video = ["mp4", "webm", "mov", "avi", "mkv", "flv", "wmv", "m4v", "3gp"]
audio = ["mp3", "wav", "ogg", "m4a", "flac", "aac", "wma"]

data = ["csv", "tsv", "sql", "sqlite", "db", "json", "xml", "yaml", "yml"]
archive = ["zip", "tar", "gz", "bz2", "xz", "7z", "rar", "iso", "dmg"]

[extensions.colors]
rust = "#ff4d55"
python = "#a8b2ba"
javascript = "#cfd6dc"
typescript = "#b3bbc3"
java = "#ff4d55"
csharp = "#a8b2ba"
cpp = "#ff4d55"
go = "#b3bbc3"
ruby = "#ff4d55"
php = "#a8b2ba"
swift = "#ff4d55"
kotlin = "#a8b2ba"
nix = "#b3bbc3"

markup = "#b8cfe2"
style = "#a8b2ba"
web_config = "#dde3e8"

shell = "#a8b2ba"
script = "#dde3e8"

doc = "#dde3e8"

image = "#bec5cc"
video = "#bec5cc"
audio = "#bec5cc"

data = "#dde3e8"
archive = "#ff4d55"

rs = "#ff4d55"
py = "#a8b2ba"
js = "#cfd6dc"
ts = "#b3bbc3"
jsx = "#cfd6dc"
tsx = "#b3bbc3"
vue = "#a8b2ba"
css = "#a8b2ba"
scss = "#a8b2ba"
html = "#b8cfe2"
md = "#dde3e8"
json = "#dde3e8"
yaml = "#dde3e8"
toml = "#dde3e8"
sql = "#b3bbc3"
