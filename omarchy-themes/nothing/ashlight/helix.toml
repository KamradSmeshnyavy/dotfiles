# Nothing Ash Light — helix
"ui.background" = { bg = "bg" }
"ui.text" = "fg"
"ui.text.focus" = { fg = "fg", bg = "raised" }
"ui.cursor" = { fg = "on_accent", bg = "dim" }
"ui.cursor.primary" = { fg = "on_accent", bg = "accent" }
"ui.cursor.match" = { bg = "line", modifiers = ["bold"] }
"ui.selection" = { bg = "raised" }
"ui.selection.primary" = { bg = "selection" }
"ui.linenr" = "comment"
"ui.linenr.selected" = "fg"
"ui.cursorline.primary" = { bg = "panel" }
"ui.statusline" = { fg = "dim", bg = "panel" }
"ui.statusline.inactive" = { fg = "comment", bg = "panel" }
"ui.statusline.normal" = { fg = "on_accent", bg = "accent", modifiers = ["bold"] }
"ui.statusline.insert" = { fg = "bg", bg = "string", modifiers = ["bold"] }
"ui.statusline.select" = { fg = "bg", bg = "special", modifiers = ["bold"] }
"ui.popup" = { bg = "panel" }
"ui.window" = "line"
"ui.help" = { fg = "fg", bg = "panel" }
"ui.menu" = { fg = "fg", bg = "panel" }
"ui.menu.selected" = { bg = "raised" }
"ui.virtual.whitespace" = "line"
"ui.virtual.ruler" = { bg = "panel" }
"ui.virtual.inlay-hint" = "comment"
"comment" = { fg = "comment", modifiers = ["italic"] }
"keyword" = "keyword"
"keyword.function" = "keyword"
"string" = "string"
"string.regexp" = "special"
"constant" = "constant"
"constant.numeric" = "number"
"constant.builtin.boolean" = "number"
"constant.character.escape" = "special"
"type" = "type"
"type.builtin" = "type"
"function" = "function"
"function.macro" = "special"
"variable" = "fg"
"variable.parameter" = "fg"
"variable.other.member" = "property"
"variable.builtin" = "keyword"
"attribute" = "special"
"namespace" = "type"
"tag" = "keyword"
"label" = "special"
"operator" = "dim"
"punctuation" = "dim"
"constructor" = "type"
"markup.heading" = { fg = "accent", modifiers = ["bold"] }
"markup.bold" = { modifiers = ["bold"] }
"markup.italic" = { modifiers = ["italic"] }
"markup.link.url" = { fg = "function", modifiers = ["underlined"] }
"markup.raw" = "string"
"markup.list" = "keyword"
"markup.quote" = "dim"
"diff.plus" = "ok"
"diff.minus" = "error"
"diff.delta" = "info"
"error" = "error"
"warning" = "warn"
"info" = "info"
"hint" = "hint"
"diagnostic.error" = { underline = { style = "curl", color = "error" } }
"diagnostic.warning" = { underline = { style = "curl", color = "warn" } }

[palette]
bg = "#f4f4f2"
panel = "#e9e9e6"
raised = "#ffffff"
line = "#d4d4d0"
fg = "#262524"
dim = "#4f4d4b"
comment = "#86837f"
accent = "#d71921"
selection = "#f6d4d5"
keyword = "#c8102e"
string = "#5e574f"
number = "#b33a4c"
type = "#9b1c2c"
function = "#000000"
property = "#44505a"
special = "#c4283f"
constant = "#7c2a35"
error = "#c41e24"
warn = "#b33a4c"
info = "#44505a"
hint = "#5e574f"
ok = "#1a1a1a"
on_accent = "#ffffff"
