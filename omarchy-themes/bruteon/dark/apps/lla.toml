name = "omarchy"
author = "Mohamed Achaq"
description = "A soothing pastel theme for the high-spirited, featuring warm, cozy colors"

[colors]
file = "#f3e6dc"
directory = "#f2d4bb"
symlink = "#f0c39a"
executable = "#dba57d"

size = "#947460"
date = "#947460"
user = "#ff8a80"
group = "#947460"

permission_dir = "#f2d4bb"
permission_read = "#dba57d"
permission_write = "#ff8a80"
permission_exec = "#ff8a80"
permission_none = "#947460"

[special_files]
[special_files.folders]
"node_modules" = { h = 0, s = 0, l = 0.15 }
"target" = "#947460"
"dist" = "#947460"
".git" = "#f2d4bb"
"build" = "#947460"
".cache" = "#947460"
"*-env" = "#dba57d"
"venv" = "#dba57d"
".env" = "#dba57d"
"*.d" = "#f0c39a"
"*_cache" = "#947460"
"*-cache" = "#947460"

[special_files.dotfiles]
".gitignore" = "#c79b7f"
".env" = "#f2d4bb"
".dockerignore" = "#c79b7f"
".editorconfig" = "#c79b7f"
".prettierrc" = "#c79b7f"
".eslintrc" = "#c79b7f"
".babelrc" = "#c79b7f"

[special_files.exact_match]
"Dockerfile" = "#c79b7f"
"docker-compose.yml" = "#c79b7f"
"Makefile" = "#ff8a80"
"CMakeLists.txt" = "#ff8a80"
"README.md" = "#f2d4bb"
"LICENSE" = "#f2d4bb"
"package.json" = "#f2d4bb"
"Cargo.toml" = "#ff8a80"
"go.mod" = "#c79b7f"
"flake.nix" = "#f2d4bb"
"flake.lock" = "#947460"
"shell.nix" = "#f2d4bb"
"default.nix" = "#f2d4bb"

[special_files.patterns]
"*rc" = "#c79b7f"
"*.min.*" = "#947460"
"*.test.*" = "#dba57d"
"*.spec.*" = "#dba57d"
"*.lock" = "#947460"
"*.config.*" = "#c79b7f"

[extensions.groups]
rust = ["rs", "toml"]
python = ["py", "pyi", "pyw", "ipynb"]
javascript = ["js", "mjs", "cjs", "jsx"]
typescript = ["ts", "tsx", "d.ts"]
java = ["java", "jar", "class"]
csharp = ["cs", "csx"]
cpp = ["cpp", "cc", "cxx", "c++", "hpp", "hxx", "h++"]
go = ["go"]
ruby = ["rb", "erb"]
php = ["php", "phtml"]
swift = ["swift"]
kotlin = ["kt", "kts"]
nix = ["nix"]

markup = ["html", "htm", "xhtml", "xml", "svg", "vue", "wasm", "ejs"]
style = ["css", "scss", "sass", "less", "styl"]
web_config = ["json", "json5", "yaml", "yml", "toml", "ini", "conf", "config"]

shell = ["sh", "bash", "zsh", "fish", "ps1", "psm1", "psd1"]
script = ["pl", "pm", "t", "tcl", "lua", "vim", "vimrc", "r"]

doc = [
  "md",
  "rst",
  "txt",
  "org",
  "wiki",
  "adoc",
  "tex",
  "pdf",
  "epub",
  "doc",
  "docx",
  "rtf",
]

image = ["png", "jpg", "jpeg", "gif", "bmp", "tiff", "webp", "ico", "heic"]
video = ["mp4", "webm", "mov", "avi", "mkv", "flv", "wmv", "m4v", "3gp"]
audio = ["mp3", "wav", "ogg", "m4a", "flac", "aac", "wma"]

data = ["csv", "tsv", "sql", "sqlite", "db", "json", "xml", "yaml", "yml"]
archive = ["zip", "tar", "gz", "bz2", "xz", "7z", "rar", "iso", "dmg"]

[extensions.colors]
rust = "#ff8a80"
python = "#dba57d"
javascript = "#f3e6dc"
typescript = "#c79b7f"
java = "#ff8a80"
csharp = "#dba57d"
cpp = "#ff8a80"
go = "#c79b7f"
ruby = "#ff8a80"
php = "#dba57d"
swift = "#ff8a80"
kotlin = "#dba57d"
nix = "#c79b7f"

markup = "#ff8a80"
style = "#dba57d"
web_config = "#f2d4bb"

shell = "#dba57d"
script = "#f2d4bb"

doc = "#f3e6dc"

image = "#ffb77a"
video = "#ffb77a"
audio = "#ffb77a"

data = "#f2d4bb"
archive = "#ff8a80"

rs = "#ff8a80"
py = "#dba57d"
js = "#f3e6dc"
ts = "#c79b7f"
jsx = "#f3e6dc"
tsx = "#c79b7f"
vue = "#dba57d"
css = "#dba57d"
scss = "#dba57d"
html = "#ff8a80"
md = "#f3e6dc"
json = "#f2d4bb"
yaml = "#f2d4bb"
toml = "#f2d4bb"
sql = "#c79b7f"
