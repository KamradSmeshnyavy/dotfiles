name = "omarchy"
author = "Mohamed Achaq"
description = "A soothing pastel theme for the high-spirited, featuring warm, cozy colors"

[colors]
file = "#161110"
directory = "#40260a"
symlink = "#6b3b05"
executable = "#83583f"

size = "#9d7768"
date = "#9d7768"
user = "#a93f34"
group = "#9d7768"

permission_dir = "#40260a"
permission_read = "#83583f"
permission_write = "#a93f34"
permission_exec = "#a93f34"
permission_none = "#9d7768"

[special_files]
[special_files.folders]
"node_modules" = { h = 0, s = 0, l = 0.15 }
"target" = "#9d7768"
"dist" = "#9d7768"
".git" = "#40260a"
"build" = "#9d7768"
".cache" = "#9d7768"
"*-env" = "#83583f"
"venv" = "#83583f"
".env" = "#83583f"
"*.d" = "#6b3b05"
"*_cache" = "#9d7768"
"*-cache" = "#9d7768"

[special_files.dotfiles]
".gitignore" = "#885643"
".env" = "#40260a"
".dockerignore" = "#885643"
".editorconfig" = "#885643"
".prettierrc" = "#885643"
".eslintrc" = "#885643"
".babelrc" = "#885643"

[special_files.exact_match]
"Dockerfile" = "#885643"
"docker-compose.yml" = "#885643"
"Makefile" = "#a93f34"
"CMakeLists.txt" = "#a93f34"
"README.md" = "#40260a"
"LICENSE" = "#40260a"
"package.json" = "#40260a"
"Cargo.toml" = "#a93f34"
"go.mod" = "#885643"
"flake.nix" = "#40260a"
"flake.lock" = "#9d7768"
"shell.nix" = "#40260a"
"default.nix" = "#40260a"

[special_files.patterns]
"*rc" = "#885643"
"*.min.*" = "#9d7768"
"*.test.*" = "#83583f"
"*.spec.*" = "#83583f"
"*.lock" = "#9d7768"
"*.config.*" = "#885643"

[extensions.groups]
rust = ["rs", "toml"]
python = ["py", "pyi", "pyw", "ipynb"]
javascript = ["js", "mjs", "cjs", "jsx"]
typescript = ["ts", "tsx", "d.ts"]
java = ["java", "jar", "class"]
csharp = ["cs", "csx"]
cpp = ["cpp", "cc", "cxx", "c++", "hpp", "hxx", "h++"]
go = ["go"]
ruby = ["rb", "erb"]
php = ["php", "phtml"]
swift = ["swift"]
kotlin = ["kt", "kts"]
nix = ["nix"]

markup = ["html", "htm", "xhtml", "xml", "svg", "vue", "wasm", "ejs"]
style = ["css", "scss", "sass", "less", "styl"]
web_config = ["json", "json5", "yaml", "yml", "toml", "ini", "conf", "config"]

shell = ["sh", "bash", "zsh", "fish", "ps1", "psm1", "psd1"]
script = ["pl", "pm", "t", "tcl", "lua", "vim", "vimrc", "r"]

doc = [
  "md",
  "rst",
  "txt",
  "org",
  "wiki",
  "adoc",
  "tex",
  "pdf",
  "epub",
  "doc",
  "docx",
  "rtf",
]

image = ["png", "jpg", "jpeg", "gif", "bmp", "tiff", "webp", "ico", "heic"]
video = ["mp4", "webm", "mov", "avi", "mkv", "flv", "wmv", "m4v", "3gp"]
audio = ["mp3", "wav", "ogg", "m4a", "flac", "aac", "wma"]

data = ["csv", "tsv", "sql", "sqlite", "db", "json", "xml", "yaml", "yml"]
archive = ["zip", "tar", "gz", "bz2", "xz", "7z", "rar", "iso", "dmg"]

[extensions.colors]
rust = "#a93f34"
python = "#83583f"
javascript = "#161110"
typescript = "#885643"
java = "#a93f34"
csharp = "#83583f"
cpp = "#a93f34"
go = "#885643"
ruby = "#a93f34"
php = "#83583f"
swift = "#a93f34"
kotlin = "#83583f"
nix = "#885643"

markup = "#a93f34"
style = "#83583f"
web_config = "#40260a"

shell = "#83583f"
script = "#40260a"

doc = "#161110"

image = "#815c3e"
video = "#815c3e"
audio = "#815c3e"

data = "#40260a"
archive = "#a93f34"

rs = "#a93f34"
py = "#83583f"
js = "#161110"
ts = "#885643"
jsx = "#161110"
tsx = "#885643"
vue = "#83583f"
css = "#83583f"
scss = "#83583f"
html = "#a93f34"
md = "#161110"
json = "#40260a"
yaml = "#40260a"
toml = "#40260a"
sql = "#885643"
