name = "omarchy"
author = "Mohamed Achaq"
description = "A soothing pastel theme for the high-spirited, featuring warm, cozy colors"

[colors]
file = "#161110"
directory = "#48677e"
symlink = "#7c538a"
executable = "#58654a"

size = "#9d7768"
date = "#9d7768"
user = "#526a68"
group = "#9d7768"

permission_dir = "#48677e"
permission_read = "#58654a"
permission_write = "#526a68"
permission_exec = "#a93f34"
permission_none = "#9d7768"

[special_files]
[special_files.folders]
"node_modules" = { h = 0, s = 0, l = 0.15 }
"target" = "#9d7768"
"dist" = "#9d7768"
".git" = "#48677e"
"build" = "#9d7768"
".cache" = "#9d7768"
"*-env" = "#58654a"
"venv" = "#58654a"
".env" = "#58654a"
"*.d" = "#7c538a"
"*_cache" = "#9d7768"
"*-cache" = "#9d7768"

[special_files.dotfiles]
".gitignore" = "#925049"
".env" = "#48677e"
".dockerignore" = "#925049"
".editorconfig" = "#925049"
".prettierrc" = "#925049"
".eslintrc" = "#925049"
".babelrc" = "#925049"

[special_files.exact_match]
"Dockerfile" = "#925049"
"docker-compose.yml" = "#925049"
"Makefile" = "#a93f34"
"CMakeLists.txt" = "#a93f34"
"README.md" = "#48677e"
"LICENSE" = "#48677e"
"package.json" = "#48677e"
"Cargo.toml" = "#a93f34"
"go.mod" = "#925049"
"flake.nix" = "#48677e"
"flake.lock" = "#9d7768"
"shell.nix" = "#48677e"
"default.nix" = "#48677e"

[special_files.patterns]
"*rc" = "#925049"
"*.min.*" = "#9d7768"
"*.test.*" = "#58654a"
"*.spec.*" = "#58654a"
"*.lock" = "#9d7768"
"*.config.*" = "#925049"

[extensions.groups]
rust = ["rs", "toml"]
python = ["py", "pyi", "pyw", "ipynb"]
javascript = ["js", "mjs", "cjs", "jsx"]
typescript = ["ts", "tsx", "d.ts"]
java = ["java", "jar", "class"]
csharp = ["cs", "csx"]
cpp = ["cpp", "cc", "cxx", "c++", "hpp", "hxx", "h++"]
go = ["go"]
ruby = ["rb", "erb"]
php = ["php", "phtml"]
swift = ["swift"]
kotlin = ["kt", "kts"]
nix = ["nix"]

markup = ["html", "htm", "xhtml", "xml", "svg", "vue", "wasm", "ejs"]
style = ["css", "scss", "sass", "less", "styl"]
web_config = ["json", "json5", "yaml", "yml", "toml", "ini", "conf", "config"]

shell = ["sh", "bash", "zsh", "fish", "ps1", "psm1", "psd1"]
script = ["pl", "pm", "t", "tcl", "lua", "vim", "vimrc", "r"]

doc = [
  "md",
  "rst",
  "txt",
  "org",
  "wiki",
  "adoc",
  "tex",
  "pdf",
  "epub",
  "doc",
  "docx",
  "rtf",
]

image = ["png", "jpg", "jpeg", "gif", "bmp", "tiff", "webp", "ico", "heic"]
video = ["mp4", "webm", "mov", "avi", "mkv", "flv", "wmv", "m4v", "3gp"]
audio = ["mp3", "wav", "ogg", "m4a", "flac", "aac", "wma"]

data = ["csv", "tsv", "sql", "sqlite", "db", "json", "xml", "yaml", "yml"]
archive = ["zip", "tar", "gz", "bz2", "xz", "7z", "rar", "iso", "dmg"]

[extensions.colors]
rust = "#a93f34"
python = "#58654a"
javascript = "#735c33"
typescript = "#925049"
java = "#a93f34"
csharp = "#58654a"
cpp = "#a93f34"
go = "#925049"
ruby = "#a93f34"
php = "#58654a"
swift = "#a93f34"
kotlin = "#58654a"
nix = "#925049"

markup = "#526a68"
style = "#58654a"
web_config = "#48677e"

shell = "#58654a"
script = "#48677e"

doc = "#161110"

image = "#815c3e"
video = "#815c3e"
audio = "#815c3e"

data = "#48677e"
archive = "#a93f34"

rs = "#a93f34"
py = "#58654a"
js = "#735c33"
ts = "#925049"
jsx = "#735c33"
tsx = "#925049"
vue = "#58654a"
css = "#58654a"
scss = "#58654a"
html = "#526a68"
md = "#161110"
json = "#48677e"
yaml = "#48677e"
toml = "#48677e"
sql = "#925049"
