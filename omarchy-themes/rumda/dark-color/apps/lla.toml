name = "omarchy"
author = "Mohamed Achaq"
description = "A soothing pastel theme for the high-spirited, featuring warm, cozy colors"

[colors]
file = "#f0c997"
directory = "#6b8a97"
symlink = "#d25a59"
executable = "#858162"

size = "#7b674e"
date = "#7b674e"
user = "#ae785a"
group = "#7b674e"

permission_dir = "#6b8a97"
permission_read = "#858162"
permission_write = "#ae785a"
permission_exec = "#b5746a"
permission_none = "#7b674e"

[special_files]
[special_files.folders]
"node_modules" = { h = 0, s = 0, l = 0.15 }
"target" = "#7b674e"
"dist" = "#7b674e"
".git" = "#6b8a97"
"build" = "#7b674e"
".cache" = "#7b674e"
"*-env" = "#858162"
"venv" = "#858162"
".env" = "#858162"
"*.d" = "#d25a59"
"*_cache" = "#7b674e"
"*-cache" = "#7b674e"

[special_files.dotfiles]
".gitignore" = "#989a9c"
".env" = "#6b8a97"
".dockerignore" = "#989a9c"
".editorconfig" = "#989a9c"
".prettierrc" = "#989a9c"
".eslintrc" = "#989a9c"
".babelrc" = "#989a9c"

[special_files.exact_match]
"Dockerfile" = "#989a9c"
"docker-compose.yml" = "#989a9c"
"Makefile" = "#b5746a"
"CMakeLists.txt" = "#b5746a"
"README.md" = "#6b8a97"
"LICENSE" = "#6b8a97"
"package.json" = "#6b8a97"
"Cargo.toml" = "#b5746a"
"go.mod" = "#989a9c"
"flake.nix" = "#6b8a97"
"flake.lock" = "#7b674e"
"shell.nix" = "#6b8a97"
"default.nix" = "#6b8a97"

[special_files.patterns]
"*rc" = "#989a9c"
"*.min.*" = "#7b674e"
"*.test.*" = "#858162"
"*.spec.*" = "#858162"
"*.lock" = "#7b674e"
"*.config.*" = "#989a9c"

[extensions.groups]
rust = ["rs", "toml"]
python = ["py", "pyi", "pyw", "ipynb"]
javascript = ["js", "mjs", "cjs", "jsx"]
typescript = ["ts", "tsx", "d.ts"]
java = ["java", "jar", "class"]
csharp = ["cs", "csx"]
cpp = ["cpp", "cc", "cxx", "c++", "hpp", "hxx", "h++"]
go = ["go"]
ruby = ["rb", "erb"]
php = ["php", "phtml"]
swift = ["swift"]
kotlin = ["kt", "kts"]
nix = ["nix"]

markup = ["html", "htm", "xhtml", "xml", "svg", "vue", "wasm", "ejs"]
style = ["css", "scss", "sass", "less", "styl"]
web_config = ["json", "json5", "yaml", "yml", "toml", "ini", "conf", "config"]

shell = ["sh", "bash", "zsh", "fish", "ps1", "psm1", "psd1"]
script = ["pl", "pm", "t", "tcl", "lua", "vim", "vimrc", "r"]

doc = [
  "md",
  "rst",
  "txt",
  "org",
  "wiki",
  "adoc",
  "tex",
  "pdf",
  "epub",
  "doc",
  "docx",
  "rtf",
]

image = ["png", "jpg", "jpeg", "gif", "bmp", "tiff", "webp", "ico", "heic"]
video = ["mp4", "webm", "mov", "avi", "mkv", "flv", "wmv", "m4v", "3gp"]
audio = ["mp3", "wav", "ogg", "m4a", "flac", "aac", "wma"]

data = ["csv", "tsv", "sql", "sqlite", "db", "json", "xml", "yaml", "yml"]
archive = ["zip", "tar", "gz", "bz2", "xz", "7z", "rar", "iso", "dmg"]

[extensions.colors]
rust = "#b5746a"
python = "#858162"
javascript = "#d68e60"
typescript = "#989a9c"
java = "#b5746a"
csharp = "#858162"
cpp = "#b5746a"
go = "#989a9c"
ruby = "#b5746a"
php = "#858162"
swift = "#b5746a"
kotlin = "#858162"
nix = "#989a9c"

markup = "#ae785a"
style = "#858162"
web_config = "#6b8a97"

shell = "#858162"
script = "#6b8a97"

doc = "#f0c997"

image = "#d08b30"
video = "#d08b30"
audio = "#d08b30"

data = "#6b8a97"
archive = "#b5746a"

rs = "#b5746a"
py = "#858162"
js = "#d68e60"
ts = "#989a9c"
jsx = "#d68e60"
tsx = "#989a9c"
vue = "#858162"
css = "#858162"
scss = "#858162"
html = "#ae785a"
md = "#f0c997"
json = "#6b8a97"
yaml = "#6b8a97"
toml = "#6b8a97"
sql = "#989a9c"
