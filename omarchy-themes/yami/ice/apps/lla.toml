name = "omarchy"
author = "Mohamed Achaq"
description = "A soothing pastel theme for the high-spirited, featuring warm, cozy colors"

[colors]
file = "#e2e2e3"
directory = "#bbdaea"
symlink = "#47c3ff"
executable = "#a2c9dc"

size = "#636469"
date = "#636469"
user = "#3a9fd0"
group = "#636469"

permission_dir = "#bbdaea"
permission_read = "#a2c9dc"
permission_write = "#3a9fd0"
permission_exec = "#47c3ff"
permission_none = "#636469"

[special_files]
[special_files.folders]
"node_modules" = { h = 0, s = 0, l = 0.15 }
"target" = "#636469"
"dist" = "#636469"
".git" = "#bbdaea"
"build" = "#636469"
".cache" = "#636469"
"*-env" = "#a2c9dc"
"venv" = "#a2c9dc"
".env" = "#a2c9dc"
"*.d" = "#47c3ff"
"*_cache" = "#636469"
"*-cache" = "#636469"

[special_files.dotfiles]
".gitignore" = "#82858b"
".env" = "#bbdaea"
".dockerignore" = "#82858b"
".editorconfig" = "#82858b"
".prettierrc" = "#82858b"
".eslintrc" = "#82858b"
".babelrc" = "#82858b"

[special_files.exact_match]
"Dockerfile" = "#82858b"
"docker-compose.yml" = "#82858b"
"Makefile" = "#47c3ff"
"CMakeLists.txt" = "#47c3ff"
"README.md" = "#bbdaea"
"LICENSE" = "#bbdaea"
"package.json" = "#bbdaea"
"Cargo.toml" = "#47c3ff"
"go.mod" = "#82858b"
"flake.nix" = "#bbdaea"
"flake.lock" = "#636469"
"shell.nix" = "#bbdaea"
"default.nix" = "#bbdaea"

[special_files.patterns]
"*rc" = "#82858b"
"*.min.*" = "#636469"
"*.test.*" = "#a2c9dc"
"*.spec.*" = "#a2c9dc"
"*.lock" = "#636469"
"*.config.*" = "#82858b"

[extensions.groups]
rust = ["rs", "toml"]
python = ["py", "pyi", "pyw", "ipynb"]
javascript = ["js", "mjs", "cjs", "jsx"]
typescript = ["ts", "tsx", "d.ts"]
java = ["java", "jar", "class"]
csharp = ["cs", "csx"]
cpp = ["cpp", "cc", "cxx", "c++", "hpp", "hxx", "h++"]
go = ["go"]
ruby = ["rb", "erb"]
php = ["php", "phtml"]
swift = ["swift"]
kotlin = ["kt", "kts"]
nix = ["nix"]

markup = ["html", "htm", "xhtml", "xml", "svg", "vue", "wasm", "ejs"]
style = ["css", "scss", "sass", "less", "styl"]
web_config = ["json", "json5", "yaml", "yml", "toml", "ini", "conf", "config"]

shell = ["sh", "bash", "zsh", "fish", "ps1", "psm1", "psd1"]
script = ["pl", "pm", "t", "tcl", "lua", "vim", "vimrc", "r"]

doc = [
  "md",
  "rst",
  "txt",
  "org",
  "wiki",
  "adoc",
  "tex",
  "pdf",
  "epub",
  "doc",
  "docx",
  "rtf",
]

image = ["png", "jpg", "jpeg", "gif", "bmp", "tiff", "webp", "ico", "heic"]
video = ["mp4", "webm", "mov", "avi", "mkv", "flv", "wmv", "m4v", "3gp"]
audio = ["mp3", "wav", "ogg", "m4a", "flac", "aac", "wma"]

data = ["csv", "tsv", "sql", "sqlite", "db", "json", "xml", "yaml", "yml"]
archive = ["zip", "tar", "gz", "bz2", "xz", "7z", "rar", "iso", "dmg"]

[extensions.colors]
rust = "#47c3ff"
python = "#a2c9dc"
javascript = "#e2e2e3"
typescript = "#82858b"
java = "#47c3ff"
csharp = "#a2c9dc"
cpp = "#47c3ff"
go = "#82858b"
ruby = "#47c3ff"
php = "#a2c9dc"
swift = "#47c3ff"
kotlin = "#a2c9dc"
nix = "#82858b"

markup = "#3a9fd0"
style = "#a2c9dc"
web_config = "#bbdaea"

shell = "#a2c9dc"
script = "#bbdaea"

doc = "#e2e2e3"

image = "#328ab5"
video = "#328ab5"
audio = "#328ab5"

data = "#bbdaea"
archive = "#47c3ff"

rs = "#47c3ff"
py = "#a2c9dc"
js = "#e2e2e3"
ts = "#82858b"
jsx = "#e2e2e3"
tsx = "#82858b"
vue = "#a2c9dc"
css = "#a2c9dc"
scss = "#a2c9dc"
html = "#3a9fd0"
md = "#e2e2e3"
json = "#bbdaea"
yaml = "#bbdaea"
toml = "#bbdaea"
sql = "#82858b"
