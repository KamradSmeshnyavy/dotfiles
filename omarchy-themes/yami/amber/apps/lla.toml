name = "omarchy"
author = "Mohamed Achaq"
description = "A soothing pastel theme for the high-spirited, featuring warm, cozy colors"

[colors]
file = "#eae1da"
directory = "#efd2ac"
symlink = "#ffa724"
executable = "#e4c193"

size = "#716258"
date = "#716258"
user = "#d98e1f"
group = "#716258"

permission_dir = "#efd2ac"
permission_read = "#e4c193"
permission_write = "#d98e1f"
permission_exec = "#ffa724"
permission_none = "#716258"

[special_files]
[special_files.folders]
"node_modules" = { h = 0, s = 0, l = 0.15 }
"target" = "#716258"
"dist" = "#716258"
".git" = "#efd2ac"
"build" = "#716258"
".cache" = "#716258"
"*-env" = "#e4c193"
"venv" = "#e4c193"
".env" = "#e4c193"
"*.d" = "#ffa724"
"*_cache" = "#716258"
"*-cache" = "#716258"

[special_files.dotfiles]
".gitignore" = "#958376"
".env" = "#efd2ac"
".dockerignore" = "#958376"
".editorconfig" = "#958376"
".prettierrc" = "#958376"
".eslintrc" = "#958376"
".babelrc" = "#958376"

[special_files.exact_match]
"Dockerfile" = "#958376"
"docker-compose.yml" = "#958376"
"Makefile" = "#ffa724"
"CMakeLists.txt" = "#ffa724"
"README.md" = "#efd2ac"
"LICENSE" = "#efd2ac"
"package.json" = "#efd2ac"
"Cargo.toml" = "#ffa724"
"go.mod" = "#958376"
"flake.nix" = "#efd2ac"
"flake.lock" = "#716258"
"shell.nix" = "#efd2ac"
"default.nix" = "#efd2ac"

[special_files.patterns]
"*rc" = "#958376"
"*.min.*" = "#716258"
"*.test.*" = "#e4c193"
"*.spec.*" = "#e4c193"
"*.lock" = "#716258"
"*.config.*" = "#958376"

[extensions.groups]
rust = ["rs", "toml"]
python = ["py", "pyi", "pyw", "ipynb"]
javascript = ["js", "mjs", "cjs", "jsx"]
typescript = ["ts", "tsx", "d.ts"]
java = ["java", "jar", "class"]
csharp = ["cs", "csx"]
cpp = ["cpp", "cc", "cxx", "c++", "hpp", "hxx", "h++"]
go = ["go"]
ruby = ["rb", "erb"]
php = ["php", "phtml"]
swift = ["swift"]
kotlin = ["kt", "kts"]
nix = ["nix"]

markup = ["html", "htm", "xhtml", "xml", "svg", "vue", "wasm", "ejs"]
style = ["css", "scss", "sass", "less", "styl"]
web_config = ["json", "json5", "yaml", "yml", "toml", "ini", "conf", "config"]

shell = ["sh", "bash", "zsh", "fish", "ps1", "psm1", "psd1"]
script = ["pl", "pm", "t", "tcl", "lua", "vim", "vimrc", "r"]

doc = [
  "md",
  "rst",
  "txt",
  "org",
  "wiki",
  "adoc",
  "tex",
  "pdf",
  "epub",
  "doc",
  "docx",
  "rtf",
]

image = ["png", "jpg", "jpeg", "gif", "bmp", "tiff", "webp", "ico", "heic"]
video = ["mp4", "webm", "mov", "avi", "mkv", "flv", "wmv", "m4v", "3gp"]
audio = ["mp3", "wav", "ogg", "m4a", "flac", "aac", "wma"]

data = ["csv", "tsv", "sql", "sqlite", "db", "json", "xml", "yaml", "yml"]
archive = ["zip", "tar", "gz", "bz2", "xz", "7z", "rar", "iso", "dmg"]

[extensions.colors]
rust = "#ffa724"
python = "#e4c193"
javascript = "#eae1da"
typescript = "#958376"
java = "#ffa724"
csharp = "#e4c193"
cpp = "#ffa724"
go = "#958376"
ruby = "#ffa724"
php = "#e4c193"
swift = "#ffa724"
kotlin = "#e4c193"
nix = "#958376"

markup = "#d98e1f"
style = "#e4c193"
web_config = "#efd2ac"

shell = "#e4c193"
script = "#efd2ac"

doc = "#eae1da"

image = "#bd7b1b"
video = "#bd7b1b"
audio = "#bd7b1b"

data = "#efd2ac"
archive = "#ffa724"

rs = "#ffa724"
py = "#e4c193"
js = "#eae1da"
ts = "#958376"
jsx = "#eae1da"
tsx = "#958376"
vue = "#e4c193"
css = "#e4c193"
scss = "#e4c193"
html = "#d98e1f"
md = "#eae1da"
json = "#efd2ac"
yaml = "#efd2ac"
toml = "#efd2ac"
