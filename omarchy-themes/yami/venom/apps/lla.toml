name = "omarchy"
author = "Mohamed Achaq"
description = "A soothing pastel theme for the high-spirited, featuring warm, cozy colors"

[colors]
file = "#e4e2db"
directory = "#cae2b5"
symlink = "#7be244"
executable = "#b1ce9c"

size = "#66655a"
date = "#66655a"
user = "#5fae34"
group = "#66655a"

permission_dir = "#cae2b5"
permission_read = "#b1ce9c"
permission_write = "#5fae34"
permission_exec = "#7be244"
permission_none = "#66655a"

[special_files]
[special_files.folders]
"node_modules" = { h = 0, s = 0, l = 0.15 }
"target" = "#66655a"
"dist" = "#66655a"
".git" = "#cae2b5"
"build" = "#66655a"
".cache" = "#66655a"
"*-env" = "#b1ce9c"
"venv" = "#b1ce9c"
".env" = "#b1ce9c"
"*.d" = "#7be244"
"*_cache" = "#66655a"
"*-cache" = "#66655a"

[special_files.dotfiles]
".gitignore" = "#878779"
".env" = "#cae2b5"
".dockerignore" = "#878779"
".editorconfig" = "#878779"
".prettierrc" = "#878779"
".eslintrc" = "#878779"
".babelrc" = "#878779"

[special_files.exact_match]
"Dockerfile" = "#878779"
"docker-compose.yml" = "#878779"
"Makefile" = "#7be244"
"CMakeLists.txt" = "#7be244"
"README.md" = "#cae2b5"
"LICENSE" = "#cae2b5"
"package.json" = "#cae2b5"
"Cargo.toml" = "#7be244"
"go.mod" = "#878779"
"flake.nix" = "#cae2b5"
"flake.lock" = "#66655a"
"shell.nix" = "#cae2b5"
"default.nix" = "#cae2b5"

[special_files.patterns]
"*rc" = "#878779"
"*.min.*" = "#66655a"
"*.test.*" = "#b1ce9c"
"*.spec.*" = "#b1ce9c"
"*.lock" = "#66655a"
"*.config.*" = "#878779"

[extensions.groups]
rust = ["rs", "toml"]
python = ["py", "pyi", "pyw", "ipynb"]
javascript = ["js", "mjs", "cjs", "jsx"]
typescript = ["ts", "tsx", "d.ts"]
java = ["java", "jar", "class"]
csharp = ["cs", "csx"]
cpp = ["cpp", "cc", "cxx", "c++", "hpp", "hxx", "h++"]
go = ["go"]
ruby = ["rb", "erb"]
php = ["php", "phtml"]
swift = ["swift"]
kotlin = ["kt", "kts"]
nix = ["nix"]

markup = ["html", "htm", "xhtml", "xml", "svg", "vue", "wasm", "ejs"]
style = ["css", "scss", "sass", "less", "styl"]
web_config = ["json", "json5", "yaml", "yml", "toml", "ini", "conf", "config"]

shell = ["sh", "bash", "zsh", "fish", "ps1", "psm1", "psd1"]
script = ["pl", "pm", "t", "tcl", "lua", "vim", "vimrc", "r"]

doc = [
  "md",
  "rst",
  "txt",
  "org",
  "wiki",
  "adoc",
  "tex",
  "pdf",
  "epub",
  "doc",
  "docx",
  "rtf",
]

image = ["png", "jpg", "jpeg", "gif", "bmp", "tiff", "webp", "ico", "heic"]
video = ["mp4", "webm", "mov", "avi", "mkv", "flv", "wmv", "m4v", "3gp"]
audio = ["mp3", "wav", "ogg", "m4a", "flac", "aac", "wma"]

data = ["csv", "tsv", "sql", "sqlite", "db", "json", "xml", "yaml", "yml"]
archive = ["zip", "tar", "gz", "bz2", "xz", "7z", "rar", "iso", "dmg"]

[extensions.colors]
rust = "#7be244"
python = "#b1ce9c"
javascript = "#e4e2db"
typescript = "#878779"
java = "#7be244"
csharp = "#b1ce9c"
cpp = "#7be244"
go = "#878779"
ruby = "#7be244"
php = "#b1ce9c"
swift = "#7be244"
kotlin = "#b1ce9c"
nix = "#878779"

markup = "#5fae34"
style = "#b1ce9c"
web_config = "#cae2b5"

shell = "#b1ce9c"
script = "#cae2b5"

doc = "#e4e2db"

image = "#53972d"
video = "#53972d"
audio = "#53972d"

data = "#cae2b5"
archive = "#7be244"

rs = "#7be244"
py = "#b1ce9c"
js = "#e4e2db"
ts = "#878779"
jsx = "#e4e2db"
tsx = "#878779"
vue = "#b1ce9c"
css = "#b1ce9c"
scss = "#b1ce9c"
html = "#5fae34"
md = "#e4e2db"
json = "#cae2b5"
yaml = "#cae2b5"
toml = "#cae2b5"
sql = "#878779"
