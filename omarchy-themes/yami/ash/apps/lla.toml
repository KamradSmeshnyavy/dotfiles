name = "omarchy"
author = "Mohamed Achaq"
description = "A soothing pastel theme for the high-spirited, featuring warm, cozy colors"

[colors]
file = "#e8e2e0"
directory = "#e4dedb"
symlink = "#dad3cb"
executable = "#d0cac6"

size = "#6d6463"
date = "#6d6463"
user = "#a8a29c"
group = "#6d6463"

permission_dir = "#e4dedb"
permission_read = "#d0cac6"
permission_write = "#a8a29c"
permission_exec = "#dad3cb"
permission_none = "#6d6463"

[special_files]
[special_files.folders]
"node_modules" = { h = 0, s = 0, l = 0.15 }
"target" = "#6d6463"
"dist" = "#6d6463"
".git" = "#e4dedb"
"build" = "#6d6463"
".cache" = "#6d6463"
"*-env" = "#d0cac6"
"venv" = "#d0cac6"
".env" = "#d0cac6"
"*.d" = "#dad3cb"
"*_cache" = "#6d6463"
"*-cache" = "#6d6463"

[special_files.dotfiles]
".gitignore" = "#8f8685"
".env" = "#e4dedb"
".dockerignore" = "#8f8685"
".editorconfig" = "#8f8685"
".prettierrc" = "#8f8685"
".eslintrc" = "#8f8685"
".babelrc" = "#8f8685"

[special_files.exact_match]
"Dockerfile" = "#8f8685"
"docker-compose.yml" = "#8f8685"
"Makefile" = "#dad3cb"
"CMakeLists.txt" = "#dad3cb"
"README.md" = "#e4dedb"
"LICENSE" = "#e4dedb"
"package.json" = "#e4dedb"
"Cargo.toml" = "#dad3cb"
"go.mod" = "#8f8685"
"flake.nix" = "#e4dedb"
"flake.lock" = "#6d6463"
"shell.nix" = "#e4dedb"
"default.nix" = "#e4dedb"

[special_files.patterns]
"*rc" = "#8f8685"
"*.min.*" = "#6d6463"
"*.test.*" = "#d0cac6"
"*.spec.*" = "#d0cac6"
"*.lock" = "#6d6463"
"*.config.*" = "#8f8685"

[extensions.groups]
rust = ["rs", "toml"]
python = ["py", "pyi", "pyw", "ipynb"]
javascript = ["js", "mjs", "cjs", "jsx"]
typescript = ["ts", "tsx", "d.ts"]
java = ["java", "jar", "class"]
csharp = ["cs", "csx"]
cpp = ["cpp", "cc", "cxx", "c++", "hpp", "hxx", "h++"]
go = ["go"]
ruby = ["rb", "erb"]
php = ["php", "phtml"]
swift = ["swift"]
kotlin = ["kt", "kts"]
nix = ["nix"]

markup = ["html", "htm", "xhtml", "xml", "svg", "vue", "wasm", "ejs"]
style = ["css", "scss", "sass", "less", "styl"]
web_config = ["json", "json5", "yaml", "yml", "toml", "ini", "conf", "config"]

shell = ["sh", "bash", "zsh", "fish", "ps1", "psm1", "psd1"]
script = ["pl", "pm", "t", "tcl", "lua", "vim", "vimrc", "r"]

doc = [
  "md",
  "rst",
  "txt",
  "org",
  "wiki",
  "adoc",
  "tex",
  "pdf",
  "epub",
  "doc",
  "docx",
  "rtf",
]

image = ["png", "jpg", "jpeg", "gif", "bmp", "tiff", "webp", "ico", "heic"]
video = ["mp4", "webm", "mov", "avi", "mkv", "flv", "wmv", "m4v", "3gp"]
audio = ["mp3", "wav", "ogg", "m4a", "flac", "aac", "wma"]

data = ["csv", "tsv", "sql", "sqlite", "db", "json", "xml", "yaml", "yml"]
archive = ["zip", "tar", "gz", "bz2", "xz", "7z", "rar", "iso", "dmg"]

[extensions.colors]
rust = "#dad3cb"
python = "#d0cac6"
javascript = "#e8e2e0"
typescript = "#8f8685"
java = "#dad3cb"
csharp = "#d0cac6"
cpp = "#dad3cb"
go = "#8f8685"
ruby = "#dad3cb"
php = "#d0cac6"
swift = "#dad3cb"
kotlin = "#d0cac6"
nix = "#8f8685"

markup = "#a8a29c"
style = "#d0cac6"
web_config = "#e4dedb"

shell = "#d0cac6"
script = "#e4dedb"

doc = "#e8e2e0"

image = "#928d88"
video = "#928d88"
audio = "#928d88"

data = "#e4dedb"
archive = "#dad3cb"

rs = "#dad3cb"
py = "#d0cac6"
js = "#e8e2e0"
ts = "#8f8685"
jsx = "#e8e2e0"
tsx = "#8f8685"
vue = "#d0cac6"
css = "#d0cac6"
scss = "#d0cac6"
html = "#a8a29c"
md = "#e8e2e0"
json = "#e4dedb"
yaml = "#e4dedb"
toml = "#e4dedb"
sql = "#8f8685"
