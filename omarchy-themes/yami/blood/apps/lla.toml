name = "omarchy"
author = "Mohamed Achaq"
description = "A soothing pastel theme for the high-spirited, featuring warm, cozy colors"

[colors]
file = "#e9dbda"
directory = "#eeacac"
symlink = "#ff1d24"
executable = "#db9092"

size = "#6f5758"
date = "#6f5758"
user = "#d1494e"
group = "#6f5758"

permission_dir = "#eeacac"
permission_read = "#db9092"
permission_write = "#d1494e"
permission_exec = "#ff1d24"
permission_none = "#6f5758"

[special_files]
[special_files.folders]
"node_modules" = { h = 0, s = 0, l = 0.15 }
"target" = "#6f5758"
"dist" = "#6f5758"
".git" = "#eeacac"
"build" = "#6f5758"
".cache" = "#6f5758"
"*-env" = "#db9092"
"venv" = "#db9092"
".env" = "#db9092"
"*.d" = "#ff1d24"
"*_cache" = "#6f5758"
"*-cache" = "#6f5758"

[special_files.dotfiles]
".gitignore" = "#937576"
".env" = "#eeacac"
".dockerignore" = "#937576"
".editorconfig" = "#937576"
".prettierrc" = "#937576"
".eslintrc" = "#937576"
".babelrc" = "#937576"

[special_files.exact_match]
"Dockerfile" = "#937576"
"docker-compose.yml" = "#937576"
"Makefile" = "#ff1d24"
"CMakeLists.txt" = "#ff1d24"
"README.md" = "#eeacac"
"LICENSE" = "#eeacac"
"package.json" = "#eeacac"
"Cargo.toml" = "#ff1d24"
"go.mod" = "#937576"
"flake.nix" = "#eeacac"
"flake.lock" = "#6f5758"
"shell.nix" = "#eeacac"
"default.nix" = "#eeacac"

[special_files.patterns]
"*rc" = "#937576"
"*.min.*" = "#6f5758"
"*.test.*" = "#db9092"
"*.spec.*" = "#db9092"
"*.lock" = "#6f5758"
"*.config.*" = "#937576"

[extensions.groups]
rust = ["rs", "toml"]
python = ["py", "pyi", "pyw", "ipynb"]
javascript = ["js", "mjs", "cjs", "jsx"]
typescript = ["ts", "tsx", "d.ts"]
java = ["java", "jar", "class"]
csharp = ["cs", "csx"]
cpp = ["cpp", "cc", "cxx", "c++", "hpp", "hxx", "h++"]
go = ["go"]
ruby = ["rb", "erb"]
php = ["php", "phtml"]
swift = ["swift"]
kotlin = ["kt", "kts"]
nix = ["nix"]

markup = ["html", "htm", "xhtml", "xml", "svg", "vue", "wasm", "ejs"]
style = ["css", "scss", "sass", "less", "styl"]
web_config = ["json", "json5", "yaml", "yml", "toml", "ini", "conf", "config"]

shell = ["sh", "bash", "zsh", "fish", "ps1", "psm1", "psd1"]
script = ["pl", "pm", "t", "tcl", "lua", "vim", "vimrc", "r"]

doc = [
  "md",
  "rst",
  "txt",
  "org",
  "wiki",
  "adoc",
  "tex",
  "pdf",
  "epub",
  "doc",
  "docx",
  "rtf",
]

image = ["png", "jpg", "jpeg", "gif", "bmp", "tiff", "webp", "ico", "heic"]
video = ["mp4", "webm", "mov", "avi", "mkv", "flv", "wmv", "m4v", "3gp"]
audio = ["mp3", "wav", "ogg", "m4a", "flac", "aac", "wma"]

data = ["csv", "tsv", "sql", "sqlite", "db", "json", "xml", "yaml", "yml"]
archive = ["zip", "tar", "gz", "bz2", "xz", "7z", "rar", "iso", "dmg"]

[extensions.colors]
rust = "#ff1d24"
python = "#db9092"
javascript = "#e9dbda"
typescript = "#937576"
java = "#ff1d24"
csharp = "#db9092"
cpp = "#ff1d24"
go = "#937576"
ruby = "#ff1d24"
php = "#db9092"
swift = "#ff1d24"
kotlin = "#db9092"
nix = "#937576"

markup = "#d1494e"
style = "#db9092"
web_config = "#eeacac"

shell = "#db9092"
script = "#eeacac"

doc = "#e9dbda"

image = "#c45c60"
video = "#c45c60"
audio = "#c45c60"

data = "#eeacac"
archive = "#ff1d24"

rs = "#ff1d24"
py = "#db9092"
js = "#e9dbda"
ts = "#937576"
jsx = "#e9dbda"
tsx = "#937576"
vue = "#db9092"
css = "#db9092"
scss = "#db9092"
html = "#d1494e"
md = "#e9dbda"
json = "#eeacac"
yaml = "#eeacac"
toml = "#eeacac"
sql = "#937576"
