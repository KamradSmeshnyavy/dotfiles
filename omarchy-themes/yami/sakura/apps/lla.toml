name = "omarchy"
author = "Mohamed Achaq"
description = "A soothing pastel theme for the high-spirited, featuring warm, cozy colors"

[colors]
file = "#eadedf"
directory = "#efc0cc"
symlink = "#ff6692"
executable = "#e4abb9"

size = "#715c60"
date = "#715c60"
user = "#d9577c"
group = "#715c60"

permission_dir = "#efc0cc"
permission_read = "#e4abb9"
permission_write = "#d9577c"
permission_exec = "#ff6692"
permission_none = "#715c60"

[special_files]
[special_files.folders]
"node_modules" = { h = 0, s = 0, l = 0.15 }
"target" = "#715c60"
"dist" = "#715c60"
".git" = "#efc0cc"
"build" = "#715c60"
".cache" = "#715c60"
"*-env" = "#e4abb9"
"venv" = "#e4abb9"
".env" = "#e4abb9"
"*.d" = "#ff6692"
"*_cache" = "#715c60"
"*-cache" = "#715c60"

[special_files.dotfiles]
".gitignore" = "#957d81"
".env" = "#efc0cc"
".dockerignore" = "#957d81"
".editorconfig" = "#957d81"
".prettierrc" = "#957d81"
".eslintrc" = "#957d81"
".babelrc" = "#957d81"

[special_files.exact_match]
"Dockerfile" = "#957d81"
"docker-compose.yml" = "#957d81"
"Makefile" = "#ff6692"
"CMakeLists.txt" = "#ff6692"
"README.md" = "#efc0cc"
"LICENSE" = "#efc0cc"
"package.json" = "#efc0cc"
"Cargo.toml" = "#ff6692"
"go.mod" = "#957d81"
"flake.nix" = "#efc0cc"
"flake.lock" = "#715c60"
"shell.nix" = "#efc0cc"
"default.nix" = "#efc0cc"

[special_files.patterns]
"*rc" = "#957d81"
"*.min.*" = "#715c60"
"*.test.*" = "#e4abb9"
"*.spec.*" = "#e4abb9"
"*.lock" = "#715c60"
"*.config.*" = "#957d81"

[extensions.groups]
rust = ["rs", "toml"]
python = ["py", "pyi", "pyw", "ipynb"]
javascript = ["js", "mjs", "cjs", "jsx"]
typescript = ["ts", "tsx", "d.ts"]
java = ["java", "jar", "class"]
csharp = ["cs", "csx"]
cpp = ["cpp", "cc", "cxx", "c++", "hpp", "hxx", "h++"]
go = ["go"]
ruby = ["rb", "erb"]
php = ["php", "phtml"]
swift = ["swift"]
kotlin = ["kt", "kts"]
nix = ["nix"]

markup = ["html", "htm", "xhtml", "xml", "svg", "vue", "wasm", "ejs"]
style = ["css", "scss", "sass", "less", "styl"]
web_config = ["json", "json5", "yaml", "yml", "toml", "ini", "conf", "config"]

shell = ["sh", "bash", "zsh", "fish", "ps1", "psm1", "psd1"]
script = ["pl", "pm", "t", "tcl", "lua", "vim", "vimrc", "r"]

doc = [
  "md",
  "rst",
  "txt",
  "org",
  "wiki",
  "adoc",
  "tex",
  "pdf",
  "epub",
  "doc",
  "docx",
  "rtf",
]

image = ["png", "jpg", "jpeg", "gif", "bmp", "tiff", "webp", "ico", "heic"]
video = ["mp4", "webm", "mov", "avi", "mkv", "flv", "wmv", "m4v", "3gp"]
audio = ["mp3", "wav", "ogg", "m4a", "flac", "aac", "wma"]

data = ["csv", "tsv", "sql", "sqlite", "db", "json", "xml", "yaml", "yml"]
archive = ["zip", "tar", "gz", "bz2", "xz", "7z", "rar", "iso", "dmg"]

[extensions.colors]
rust = "#ff6692"
python = "#e4abb9"
javascript = "#eadedf"
typescript = "#957d81"
java = "#ff6692"
csharp = "#e4abb9"
cpp = "#ff6692"
go = "#957d81"
ruby = "#ff6692"
php = "#e4abb9"
swift = "#ff6692"
kotlin = "#e4abb9"
nix = "#957d81"

markup = "#d9577c"
style = "#e4abb9"
web_config = "#efc0cc"

shell = "#e4abb9"
script = "#efc0cc"

doc = "#eadedf"

image = "#c15775"
video = "#c15775"
audio = "#c15775"

data = "#efc0cc"
archive = "#ff6692"

rs = "#ff6692"
py = "#e4abb9"
js = "#eadedf"
ts = "#957d81"
jsx = "#eadedf"
tsx = "#957d81"
vue = "#e4abb9"
css = "#e4abb9"
scss = "#e4abb9"
html = "#d9577c"
md = "#eadedf"
json = "#efc0cc"
yaml = "#efc0cc"
toml = "#efc0cc"
sql = "#957d81"
