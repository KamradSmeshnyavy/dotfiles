name = "omarchy"
author = "Mohamed Achaq"
description = "A soothing pastel theme for the high-spirited, featuring warm, cozy colors"

[colors]
file = "#e6dee5"
directory = "#d1bfec"
symlink = "#9362ff"
executable = "#c3ade9"

size = "#6a5d6b"
date = "#6a5d6b"
user = "#8a5cf0"
group = "#6a5d6b"

permission_dir = "#d1bfec"
permission_read = "#c3ade9"
permission_write = "#8a5cf0"
permission_exec = "#9362ff"
permission_none = "#6a5d6b"

[special_files]
[special_files.folders]
"node_modules" = { h = 0, s = 0, l = 0.15 }
"target" = "#6a5d6b"
"dist" = "#6a5d6b"
".git" = "#d1bfec"
"build" = "#6a5d6b"
".cache" = "#6a5d6b"
"*-env" = "#c3ade9"
"venv" = "#c3ade9"
".env" = "#c3ade9"
"*.d" = "#9362ff"
"*_cache" = "#6a5d6b"
"*-cache" = "#6a5d6b"

[special_files.dotfiles]
".gitignore" = "#8c7d8f"
".env" = "#d1bfec"
".dockerignore" = "#8c7d8f"
".editorconfig" = "#8c7d8f"
".prettierrc" = "#8c7d8f"
".eslintrc" = "#8c7d8f"
".babelrc" = "#8c7d8f"

[special_files.exact_match]
"Dockerfile" = "#8c7d8f"
"docker-compose.yml" = "#8c7d8f"
"Makefile" = "#9362ff"
"CMakeLists.txt" = "#9362ff"
"README.md" = "#d1bfec"
"LICENSE" = "#d1bfec"
"package.json" = "#d1bfec"
"Cargo.toml" = "#9362ff"
"go.mod" = "#8c7d8f"
"flake.nix" = "#d1bfec"
"flake.lock" = "#6a5d6b"
"shell.nix" = "#d1bfec"
"default.nix" = "#d1bfec"

[special_files.patterns]
"*rc" = "#8c7d8f"
"*.min.*" = "#6a5d6b"
"*.test.*" = "#c3ade9"
"*.spec.*" = "#c3ade9"
"*.lock" = "#6a5d6b"
"*.config.*" = "#8c7d8f"

[extensions.groups]
rust = ["rs", "toml"]
python = ["py", "pyi", "pyw", "ipynb"]
javascript = ["js", "mjs", "cjs", "jsx"]
typescript = ["ts", "tsx", "d.ts"]
java = ["java", "jar", "class"]
csharp = ["cs", "csx"]
cpp = ["cpp", "cc", "cxx", "c++", "hpp", "hxx", "h++"]
go = ["go"]
ruby = ["rb", "erb"]
php = ["php", "phtml"]
swift = ["swift"]
kotlin = ["kt", "kts"]
nix = ["nix"]

markup = ["html", "htm", "xhtml", "xml", "svg", "vue", "wasm", "ejs"]
style = ["css", "scss", "sass", "less", "styl"]
web_config = ["json", "json5", "yaml", "yml", "toml", "ini", "conf", "config"]

shell = ["sh", "bash", "zsh", "fish", "ps1", "psm1", "psd1"]
script = ["pl", "pm", "t", "tcl", "lua", "vim", "vimrc", "r"]

doc = [
  "md",
  "rst",
  "txt",
  "org",
  "wiki",
  "adoc",
  "tex",
  "pdf",
  "epub",
  "doc",
  "docx",
  "rtf",
]

image = ["png", "jpg", "jpeg", "gif", "bmp", "tiff", "webp", "ico", "heic"]
video = ["mp4", "webm", "mov", "avi", "mkv", "flv", "wmv", "m4v", "3gp"]
audio = ["mp3", "wav", "ogg", "m4a", "flac", "aac", "wma"]

data = ["csv", "tsv", "sql", "sqlite", "db", "json", "xml", "yaml", "yml"]
archive = ["zip", "tar", "gz", "bz2", "xz", "7z", "rar", "iso", "dmg"]

[extensions.colors]
rust = "#9362ff"
python = "#c3ade9"
javascript = "#e6dee5"
typescript = "#8c7d8f"
java = "#9362ff"
csharp = "#c3ade9"
cpp = "#9362ff"
go = "#8c7d8f"
ruby = "#9362ff"
php = "#c3ade9"
swift = "#9362ff"
kotlin = "#c3ade9"
nix = "#8c7d8f"

markup = "#8a5cf0"
style = "#c3ade9"
web_config = "#d1bfec"

shell = "#c3ade9"
script = "#d1bfec"

doc = "#e6dee5"

image = "#8864d7"
video = "#8864d7"
audio = "#8864d7"

data = "#d1bfec"
archive = "#9362ff"

rs = "#9362ff"
py = "#c3ade9"
js = "#e6dee5"
ts = "#8c7d8f"
jsx = "#e6dee5"
tsx = "#8c7d8f"
vue = "#c3ade9"
css = "#c3ade9"
scss = "#c3ade9"
html = "#8a5cf0"
md = "#e6dee5"
json = "#d1bfec"
yaml = "#d1bfec"
toml = "#d1bfec"
sql = "#8c7d8f"
