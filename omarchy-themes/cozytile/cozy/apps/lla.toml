name = "omarchy"
author = "Mohamed Achaq"
description = "A soothing pastel theme for the high-spirited, featuring warm, cozy colors"

[colors]
file = "#D8DEF5"
directory = "#bfcef3"
symlink = "#CAA9E0"
executable = "#d0c1e9"

size = "#77798d"
date = "#77798d"
user = "#E06B74"
group = "#77798d"

permission_dir = "#bfcef3"
permission_read = "#d0c1e9"
permission_write = "#E06B74"
permission_exec = "#E06B74"
permission_none = "#77798d"

[special_files]
[special_files.folders]
"node_modules" = { h = 0, s = 0, l = 0.15 }
"target" = "#77798d"
"dist" = "#77798d"
".git" = "#bfcef3"
"build" = "#77798d"
".cache" = "#77798d"
"*-env" = "#d0c1e9"
"venv" = "#d0c1e9"
".env" = "#d0c1e9"
"*.d" = "#CAA9E0"
"*_cache" = "#77798d"
"*-cache" = "#77798d"

[special_files.dotfiles]
".gitignore" = "#9a9eb3"
".env" = "#bfcef3"
".dockerignore" = "#9a9eb3"
".editorconfig" = "#9a9eb3"
".prettierrc" = "#9a9eb3"
".eslintrc" = "#9a9eb3"
".babelrc" = "#9a9eb3"

[special_files.exact_match]
"Dockerfile" = "#9a9eb3"
"docker-compose.yml" = "#9a9eb3"
"Makefile" = "#E06B74"
"CMakeLists.txt" = "#E06B74"
"README.md" = "#bfcef3"
"LICENSE" = "#bfcef3"
"package.json" = "#bfcef3"
"Cargo.toml" = "#E06B74"
"go.mod" = "#9a9eb3"
"flake.nix" = "#bfcef3"
"flake.lock" = "#77798d"
"shell.nix" = "#bfcef3"
"default.nix" = "#bfcef3"

[special_files.patterns]
"*rc" = "#9a9eb3"
"*.min.*" = "#77798d"
"*.test.*" = "#d0c1e9"
"*.spec.*" = "#d0c1e9"
"*.lock" = "#77798d"
"*.config.*" = "#9a9eb3"

[extensions.groups]
rust = ["rs", "toml"]
python = ["py", "pyi", "pyw", "ipynb"]
javascript = ["js", "mjs", "cjs", "jsx"]
typescript = ["ts", "tsx", "d.ts"]
java = ["java", "jar", "class"]
csharp = ["cs", "csx"]
cpp = ["cpp", "cc", "cxx", "c++", "hpp", "hxx", "h++"]
go = ["go"]
ruby = ["rb", "erb"]
php = ["php", "phtml"]
swift = ["swift"]
kotlin = ["kt", "kts"]
nix = ["nix"]

markup = ["html", "htm", "xhtml", "xml", "svg", "vue", "wasm", "ejs"]
style = ["css", "scss", "sass", "less", "styl"]
web_config = ["json", "json5", "yaml", "yml", "toml", "ini", "conf", "config"]

shell = ["sh", "bash", "zsh", "fish", "ps1", "psm1", "psd1"]
script = ["pl", "pm", "t", "tcl", "lua", "vim", "vimrc", "r"]

doc = [
  "md",
  "rst",
  "txt",
  "org",
  "wiki",
  "adoc",
  "tex",
  "pdf",
  "epub",
  "doc",
  "docx",
  "rtf",
]

image = ["png", "jpg", "jpeg", "gif", "bmp", "tiff", "webp", "ico", "heic"]
video = ["mp4", "webm", "mov", "avi", "mkv", "flv", "wmv", "m4v", "3gp"]
audio = ["mp3", "wav", "ogg", "m4a", "flac", "aac", "wma"]

data = ["csv", "tsv", "sql", "sqlite", "db", "json", "xml", "yaml", "yml"]
archive = ["zip", "tar", "gz", "bz2", "xz", "7z", "rar", "iso", "dmg"]

[extensions.colors]
rust = "#E06B74"
python = "#d0c1e9"
javascript = "#D8DEF5"
typescript = "#9a9eb3"
java = "#E06B74"
csharp = "#d0c1e9"
cpp = "#E06B74"
go = "#9a9eb3"
ruby = "#E06B74"
php = "#d0c1e9"
swift = "#E06B74"
kotlin = "#d0c1e9"
nix = "#9a9eb3"

markup = "#E06B74"
style = "#d0c1e9"
web_config = "#bfcef3"

shell = "#d0c1e9"
script = "#bfcef3"

doc = "#D8DEF5"

image = "#91B1F0"
video = "#91B1F0"
audio = "#91B1F0"

data = "#bfcef3"
archive = "#E06B74"

rs = "#E06B74"
py = "#d0c1e9"
js = "#D8DEF5"
ts = "#9a9eb3"
jsx = "#D8DEF5"
tsx = "#9a9eb3"
vue = "#d0c1e9"
css = "#d0c1e9"
scss = "#d0c1e9"
html = "#E06B74"
md = "#D8DEF5"
json = "#bfcef3"
yaml = "#bfcef3"
toml = "#bfcef3"
sql = "#9a9eb3"
