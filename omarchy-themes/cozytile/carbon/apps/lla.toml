name = "omarchy"
author = "Mohamed Achaq"
description = "A soothing pastel theme for the high-spirited, featuring warm, cozy colors"

[colors]
file = "#373737"
directory = "#1A1A1A"
symlink = "#333333"
executable = "#555555"

size = "#707070"
date = "#707070"
user = "#4D4D4D"
group = "#707070"

permission_dir = "#1A1A1A"
permission_read = "#555555"
permission_write = "#4D4D4D"
permission_exec = "#903434"
permission_none = "#707070"

[special_files]
[special_files.folders]
"node_modules" = { h = 0, s = 0, l = 0.15 }
"target" = "#707070"
"dist" = "#707070"
".git" = "#1A1A1A"
"build" = "#707070"
".cache" = "#707070"
"*-env" = "#555555"
"venv" = "#555555"
".env" = "#555555"
"*.d" = "#333333"
"*_cache" = "#707070"
"*-cache" = "#707070"

[special_files.dotfiles]
".gitignore" = "#535353"
".env" = "#1A1A1A"
".dockerignore" = "#535353"
".editorconfig" = "#535353"
".prettierrc" = "#535353"
".eslintrc" = "#535353"
".babelrc" = "#535353"

[special_files.exact_match]
"Dockerfile" = "#535353"
"docker-compose.yml" = "#535353"
"Makefile" = "#903434"
"CMakeLists.txt" = "#903434"
"README.md" = "#1A1A1A"
"LICENSE" = "#1A1A1A"
"package.json" = "#1A1A1A"
"Cargo.toml" = "#903434"
"go.mod" = "#535353"
"flake.nix" = "#1A1A1A"
"flake.lock" = "#707070"
"shell.nix" = "#1A1A1A"
"default.nix" = "#1A1A1A"

[special_files.patterns]
"*rc" = "#535353"
"*.min.*" = "#707070"
"*.test.*" = "#555555"
"*.spec.*" = "#555555"
"*.lock" = "#707070"
"*.config.*" = "#535353"

[extensions.groups]
rust = ["rs", "toml"]
python = ["py", "pyi", "pyw", "ipynb"]
javascript = ["js", "mjs", "cjs", "jsx"]
typescript = ["ts", "tsx", "d.ts"]
java = ["java", "jar", "class"]
csharp = ["cs", "csx"]
cpp = ["cpp", "cc", "cxx", "c++", "hpp", "hxx", "h++"]
go = ["go"]
ruby = ["rb", "erb"]
php = ["php", "phtml"]
swift = ["swift"]
kotlin = ["kt", "kts"]
nix = ["nix"]

markup = ["html", "htm", "xhtml", "xml", "svg", "vue", "wasm", "ejs"]
style = ["css", "scss", "sass", "less", "styl"]
web_config = ["json", "json5", "yaml", "yml", "toml", "ini", "conf", "config"]

shell = ["sh", "bash", "zsh", "fish", "ps1", "psm1", "psd1"]
script = ["pl", "pm", "t", "tcl", "lua", "vim", "vimrc", "r"]

doc = [
  "md",
  "rst",
  "txt",
  "org",
  "wiki",
  "adoc",
  "tex",
  "pdf",
  "epub",
  "doc",
  "docx",
  "rtf",
]

image = ["png", "jpg", "jpeg", "gif", "bmp", "tiff", "webp", "ico", "heic"]
video = ["mp4", "webm", "mov", "avi", "mkv", "flv", "wmv", "m4v", "3gp"]
audio = ["mp3", "wav", "ogg", "m4a", "flac", "aac", "wma"]

data = ["csv", "tsv", "sql", "sqlite", "db", "json", "xml", "yaml", "yml"]
archive = ["zip", "tar", "gz", "bz2", "xz", "7z", "rar", "iso", "dmg"]

[extensions.colors]
rust = "#903434"
python = "#555555"
javascript = "#474747"
typescript = "#535353"
java = "#903434"
csharp = "#555555"
cpp = "#903434"
go = "#535353"
ruby = "#903434"
php = "#555555"
swift = "#903434"
kotlin = "#555555"
nix = "#535353"

markup = "#4D4D4D"
style = "#555555"
web_config = "#1A1A1A"

shell = "#555555"
script = "#1A1A1A"

doc = "#373737"

image = "#555555"
video = "#555555"
audio = "#555555"

data = "#1A1A1A"
archive = "#903434"

rs = "#903434"
py = "#555555"
js = "#474747"
ts = "#535353"
jsx = "#474747"
tsx = "#535353"
vue = "#555555"
css = "#555555"
scss = "#555555"
html = "#4D4D4D"
md = "#373737"
json = "#1A1A1A"
yaml = "#1A1A1A"
toml = "#1A1A1A"
sql = "#535353"
