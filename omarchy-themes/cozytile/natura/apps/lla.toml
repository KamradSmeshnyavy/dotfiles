name = "omarchy"
author = "Mohamed Achaq"
description = "A soothing pastel theme for the high-spirited, featuring warm, cozy colors"

[colors]
file = "#B2BEBC"
directory = "#b2bebc"
symlink = "#738779"
executable = "#85978d"

size = "#626968"
date = "#626968"
user = "#C46A6A"
group = "#626968"

permission_dir = "#b2bebc"
permission_read = "#85978d"
permission_write = "#C46A6A"
permission_exec = "#C46A6A"
permission_none = "#626968"

[special_files]
[special_files.folders]
"node_modules" = { h = 0, s = 0, l = 0.15 }
"target" = "#626968"
"dist" = "#626968"
".git" = "#b2bebc"
"build" = "#626968"
".cache" = "#626968"
"*-env" = "#85978d"
"venv" = "#85978d"
".env" = "#85978d"
"*.d" = "#738779"
"*_cache" = "#626968"
"*-cache" = "#626968"

[special_files.dotfiles]
".gitignore" = "#798280"
".env" = "#b2bebc"
".dockerignore" = "#798280"
".editorconfig" = "#798280"
".prettierrc" = "#798280"
".eslintrc" = "#798280"
".babelrc" = "#798280"

[special_files.exact_match]
"Dockerfile" = "#798280"
"docker-compose.yml" = "#798280"
"Makefile" = "#C46A6A"
"CMakeLists.txt" = "#C46A6A"
"README.md" = "#b2bebc"
"LICENSE" = "#b2bebc"
"package.json" = "#b2bebc"
"Cargo.toml" = "#C46A6A"
"go.mod" = "#798280"
"flake.nix" = "#b2bebc"
"flake.lock" = "#626968"
"shell.nix" = "#b2bebc"
"default.nix" = "#b2bebc"

[special_files.patterns]
"*rc" = "#798280"
"*.min.*" = "#626968"
"*.test.*" = "#85978d"
"*.spec.*" = "#85978d"
"*.lock" = "#626968"
"*.config.*" = "#798280"

[extensions.groups]
rust = ["rs", "toml"]
python = ["py", "pyi", "pyw", "ipynb"]
javascript = ["js", "mjs", "cjs", "jsx"]
typescript = ["ts", "tsx", "d.ts"]
java = ["java", "jar", "class"]
csharp = ["cs", "csx"]
cpp = ["cpp", "cc", "cxx", "c++", "hpp", "hxx", "h++"]
go = ["go"]
ruby = ["rb", "erb"]
php = ["php", "phtml"]
swift = ["swift"]
kotlin = ["kt", "kts"]
nix = ["nix"]

markup = ["html", "htm", "xhtml", "xml", "svg", "vue", "wasm", "ejs"]
style = ["css", "scss", "sass", "less", "styl"]
web_config = ["json", "json5", "yaml", "yml", "toml", "ini", "conf", "config"]

shell = ["sh", "bash", "zsh", "fish", "ps1", "psm1", "psd1"]
script = ["pl", "pm", "t", "tcl", "lua", "vim", "vimrc", "r"]

doc = [
  "md",
  "rst",
  "txt",
  "org",
  "wiki",
  "adoc",
  "tex",
  "pdf",
  "epub",
  "doc",
  "docx",
  "rtf",
]

image = ["png", "jpg", "jpeg", "gif", "bmp", "tiff", "webp", "ico", "heic"]
video = ["mp4", "webm", "mov", "avi", "mkv", "flv", "wmv", "m4v", "3gp"]
audio = ["mp3", "wav", "ogg", "m4a", "flac", "aac", "wma"]

data = ["csv", "tsv", "sql", "sqlite", "db", "json", "xml", "yaml", "yml"]
archive = ["zip", "tar", "gz", "bz2", "xz", "7z", "rar", "iso", "dmg"]

[extensions.colors]
rust = "#C46A6A"
python = "#85978d"
javascript = "#B2BEBC"
typescript = "#798280"
java = "#C46A6A"
csharp = "#85978d"
cpp = "#C46A6A"
go = "#798280"
ruby = "#C46A6A"
php = "#85978d"
swift = "#C46A6A"
kotlin = "#85978d"
nix = "#798280"

markup = "#C46A6A"
style = "#85978d"
web_config = "#b2bebc"

shell = "#85978d"
script = "#b2bebc"

doc = "#B2BEBC"

image = "#B2BEBC"
video = "#B2BEBC"
audio = "#B2BEBC"

data = "#b2bebc"
archive = "#C46A6A"

rs = "#C46A6A"
py = "#85978d"
js = "#B2BEBC"
ts = "#798280"
jsx = "#B2BEBC"
tsx = "#798280"
vue = "#85978d"
css = "#85978d"
scss = "#85978d"
html = "#C46A6A"
md = "#B2BEBC"
json = "#b2bebc"
yaml = "#b2bebc"
toml = "#b2bebc"
sql = "#798280"
