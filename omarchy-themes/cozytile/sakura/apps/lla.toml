name = "omarchy"
author = "Mohamed Achaq"
description = "A soothing pastel theme for the high-spirited, featuring warm, cozy colors"

[colors]
file = "#EFE6E4"
directory = "#e4d4e4"
symlink = "#E5B9C6"
executable = "#eacdd4"

size = "#827d86"
date = "#827d86"
user = "#E06B74"
group = "#827d86"

permission_dir = "#e4d4e4"
permission_read = "#eacdd4"
permission_write = "#E06B74"
permission_exec = "#E06B74"
permission_none = "#827d86"

[special_files]
[special_files.folders]
"node_modules" = { h = 0, s = 0, l = 0.15 }
"target" = "#827d86"
"dist" = "#827d86"
".git" = "#e4d4e4"
"build" = "#827d86"
".cache" = "#827d86"
"*-env" = "#eacdd4"
"venv" = "#eacdd4"
".env" = "#eacdd4"
"*.d" = "#E5B9C6"
"*_cache" = "#827d86"
"*-cache" = "#827d86"

[special_files.dotfiles]
".gitignore" = "#a9a3a8"
".env" = "#e4d4e4"
".dockerignore" = "#a9a3a8"
".editorconfig" = "#a9a3a8"
".prettierrc" = "#a9a3a8"
".eslintrc" = "#a9a3a8"
".babelrc" = "#a9a3a8"

[special_files.exact_match]
"Dockerfile" = "#a9a3a8"
"docker-compose.yml" = "#a9a3a8"
"Makefile" = "#E06B74"
"CMakeLists.txt" = "#E06B74"
"README.md" = "#e4d4e4"
"LICENSE" = "#e4d4e4"
"package.json" = "#e4d4e4"
"Cargo.toml" = "#E06B74"
"go.mod" = "#a9a3a8"
"flake.nix" = "#e4d4e4"
"flake.lock" = "#827d86"
"shell.nix" = "#e4d4e4"
"default.nix" = "#e4d4e4"

[special_files.patterns]
"*rc" = "#a9a3a8"
"*.min.*" = "#827d86"
"*.test.*" = "#eacdd4"
"*.spec.*" = "#eacdd4"
"*.lock" = "#827d86"
"*.config.*" = "#a9a3a8"

[extensions.groups]
rust = ["rs", "toml"]
python = ["py", "pyi", "pyw", "ipynb"]
javascript = ["js", "mjs", "cjs", "jsx"]
typescript = ["ts", "tsx", "d.ts"]
java = ["java", "jar", "class"]
csharp = ["cs", "csx"]
cpp = ["cpp", "cc", "cxx", "c++", "hpp", "hxx", "h++"]
go = ["go"]
ruby = ["rb", "erb"]
php = ["php", "phtml"]
swift = ["swift"]
kotlin = ["kt", "kts"]
nix = ["nix"]

markup = ["html", "htm", "xhtml", "xml", "svg", "vue", "wasm", "ejs"]
style = ["css", "scss", "sass", "less", "styl"]
web_config = ["json", "json5", "yaml", "yml", "toml", "ini", "conf", "config"]

shell = ["sh", "bash", "zsh", "fish", "ps1", "psm1", "psd1"]
script = ["pl", "pm", "t", "tcl", "lua", "vim", "vimrc", "r"]

doc = [
  "md",
  "rst",
  "txt",
  "org",
  "wiki",
  "adoc",
  "tex",
  "pdf",
  "epub",
  "doc",
  "docx",
  "rtf",
]

image = ["png", "jpg", "jpeg", "gif", "bmp", "tiff", "webp", "ico", "heic"]
video = ["mp4", "webm", "mov", "avi", "mkv", "flv", "wmv", "m4v", "3gp"]
audio = ["mp3", "wav", "ogg", "m4a", "flac", "aac", "wma"]

data = ["csv", "tsv", "sql", "sqlite", "db", "json", "xml", "yaml", "yml"]
archive = ["zip", "tar", "gz", "bz2", "xz", "7z", "rar", "iso", "dmg"]

[extensions.colors]
rust = "#E06B74"
python = "#eacdd4"
javascript = "#EFE6E4"
typescript = "#a9a3a8"
java = "#E06B74"
csharp = "#eacdd4"
cpp = "#E06B74"
go = "#a9a3a8"
ruby = "#E06B74"
php = "#eacdd4"
swift = "#E06B74"
kotlin = "#eacdd4"
nix = "#a9a3a8"

markup = "#E06B74"
style = "#eacdd4"
web_config = "#e4d4e4"

shell = "#eacdd4"
script = "#e4d4e4"

doc = "#EFE6E4"

image = "#CFB3E5"
video = "#CFB3E5"
audio = "#CFB3E5"

data = "#e4d4e4"
archive = "#E06B74"

rs = "#E06B74"
py = "#eacdd4"
js = "#EFE6E4"
ts = "#a9a3a8"
jsx = "#EFE6E4"
tsx = "#a9a3a8"
vue = "#eacdd4"
css = "#eacdd4"
scss = "#eacdd4"
html = "#E06B74"
md = "#EFE6E4"
json = "#e4d4e4"
yaml = "#e4d4e4"
toml = "#e4d4e4"
sql = "#a9a3a8"
