name = "omarchy"
author = "Mohamed Achaq"
description = "A soothing pastel theme for the high-spirited, featuring warm, cozy colors"

[colors]
file = "#f2f6f8"
directory = "#f7f4cc"
symlink = "#fff07a"
executable = "#f8e48c"

size = "#93a1ac"
date = "#93a1ac"
user = "#ff4d6d"
group = "#93a1ac"

permission_dir = "#f7f4cc"
permission_read = "#f8e48c"
permission_write = "#ff4d6d"
permission_exec = "#ff4d6d"
permission_none = "#93a1ac"

[special_files]
[special_files.folders]
"node_modules" = { h = 0, s = 0, l = 0.15 }
"target" = "#93a1ac"
"dist" = "#93a1ac"
".git" = "#f7f4cc"
"build" = "#93a1ac"
".cache" = "#93a1ac"
"*-env" = "#f8e48c"
"venv" = "#f8e48c"
".env" = "#f8e48c"
"*.d" = "#fff07a"
"*_cache" = "#93a1ac"
"*-cache" = "#93a1ac"

[special_files.dotfiles]
".gitignore" = "#93a1ac"
".env" = "#f7f4cc"
".dockerignore" = "#93a1ac"
".editorconfig" = "#93a1ac"
".prettierrc" = "#93a1ac"
".eslintrc" = "#93a1ac"
".babelrc" = "#93a1ac"

[special_files.exact_match]
"Dockerfile" = "#93a1ac"
"docker-compose.yml" = "#93a1ac"
"Makefile" = "#ff4d6d"
"CMakeLists.txt" = "#ff4d6d"
"README.md" = "#f7f4cc"
"LICENSE" = "#f7f4cc"
"package.json" = "#f7f4cc"
"Cargo.toml" = "#ff4d6d"
"go.mod" = "#93a1ac"
"flake.nix" = "#f7f4cc"
"flake.lock" = "#93a1ac"
"shell.nix" = "#f7f4cc"
"default.nix" = "#f7f4cc"

[special_files.patterns]
"*rc" = "#93a1ac"
"*.min.*" = "#93a1ac"
"*.test.*" = "#f8e48c"
"*.spec.*" = "#f8e48c"
"*.lock" = "#93a1ac"
"*.config.*" = "#93a1ac"

[extensions.groups]
rust = ["rs", "toml"]
python = ["py", "pyi", "pyw", "ipynb"]
javascript = ["js", "mjs", "cjs", "jsx"]
typescript = ["ts", "tsx", "d.ts"]
java = ["java", "jar", "class"]
csharp = ["cs", "csx"]
cpp = ["cpp", "cc", "cxx", "c++", "hpp", "hxx", "h++"]
go = ["go"]
ruby = ["rb", "erb"]
php = ["php", "phtml"]
swift = ["swift"]
kotlin = ["kt", "kts"]
nix = ["nix"]

markup = ["html", "htm", "xhtml", "xml", "svg", "vue", "wasm", "ejs"]
style = ["css", "scss", "sass", "less", "styl"]
web_config = ["json", "json5", "yaml", "yml", "toml", "ini", "conf", "config"]

shell = ["sh", "bash", "zsh", "fish", "ps1", "psm1", "psd1"]
script = ["pl", "pm", "t", "tcl", "lua", "vim", "vimrc", "r"]

doc = [
  "md",
  "rst",
  "txt",
  "org",
  "wiki",
  "adoc",
  "tex",
  "pdf",
  "epub",
  "doc",
  "docx",
  "rtf",
]

image = ["png", "jpg", "jpeg", "gif", "bmp", "tiff", "webp", "ico", "heic"]
video = ["mp4", "webm", "mov", "avi", "mkv", "flv", "wmv", "m4v", "3gp"]
audio = ["mp3", "wav", "ogg", "m4a", "flac", "aac", "wma"]

data = ["csv", "tsv", "sql", "sqlite", "db", "json", "xml", "yaml", "yml"]
archive = ["zip", "tar", "gz", "bz2", "xz", "7z", "rar", "iso", "dmg"]

[extensions.colors]
rust = "#ff4d6d"
python = "#f8e48c"
javascript = "#f2f6f8"
typescript = "#93a1ac"
java = "#ff4d6d"
csharp = "#f8e48c"
cpp = "#ff4d6d"
go = "#93a1ac"
ruby = "#ff4d6d"
php = "#f8e48c"
swift = "#ff4d6d"
kotlin = "#f8e48c"
nix = "#93a1ac"

markup = "#ff4d6d"
style = "#f8e48c"
web_config = "#f7f4cc"

shell = "#f8e48c"
script = "#f7f4cc"

doc = "#f2f6f8"

image = "#ffd21f"
video = "#ffd21f"
audio = "#ffd21f"

data = "#f7f4cc"
archive = "#ff4d6d"

rs = "#ff4d6d"
py = "#f8e48c"
js = "#f2f6f8"
ts = "#93a1ac"
jsx = "#f2f6f8"
tsx = "#93a1ac"
vue = "#f8e48c"
css = "#f8e48c"
scss = "#f8e48c"
html = "#ff4d6d"
md = "#f2f6f8"
json = "#f7f4cc"
yaml = "#f7f4cc"
toml = "#f7f4cc"
sql = "#93a1ac"
