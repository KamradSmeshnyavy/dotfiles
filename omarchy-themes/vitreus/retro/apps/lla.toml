name = "omarchy"
author = "Mohamed Achaq"
description = "A soothing pastel theme for the high-spirited, featuring warm, cozy colors"

[colors]
file = "#2b2833"
directory = "#572730"
symlink = "#a8242b"
executable = "#883136"

size = "#6a665a"
date = "#6a665a"
user = "#ab154c"
group = "#6a665a"

permission_dir = "#572730"
permission_read = "#883136"
permission_write = "#ab154c"
permission_exec = "#ab154c"
permission_none = "#6a665a"

[special_files]
[special_files.folders]
"node_modules" = { h = 0, s = 0, l = 0.15 }
"target" = "#6a665a"
"dist" = "#6a665a"
".git" = "#572730"
"build" = "#6a665a"
".cache" = "#6a665a"
"*-env" = "#883136"
"venv" = "#883136"
".env" = "#883136"
"*.d" = "#a8242b"
"*_cache" = "#6a665a"
"*-cache" = "#6a665a"

[special_files.dotfiles]
".gitignore" = "#5c594e"
".env" = "#572730"
".dockerignore" = "#5c594e"
".editorconfig" = "#5c594e"
".prettierrc" = "#5c594e"
".eslintrc" = "#5c594e"
".babelrc" = "#5c594e"

[special_files.exact_match]
"Dockerfile" = "#5c594e"
"docker-compose.yml" = "#5c594e"
"Makefile" = "#ab154c"
"CMakeLists.txt" = "#ab154c"
"README.md" = "#572730"
"LICENSE" = "#572730"
"package.json" = "#572730"
"Cargo.toml" = "#ab154c"
"go.mod" = "#5c594e"
"flake.nix" = "#572730"
"flake.lock" = "#6a665a"
"shell.nix" = "#572730"
"default.nix" = "#572730"

[special_files.patterns]
"*rc" = "#5c594e"
"*.min.*" = "#6a665a"
"*.test.*" = "#883136"
"*.spec.*" = "#883136"
"*.lock" = "#6a665a"
"*.config.*" = "#5c594e"

[extensions.groups]
rust = ["rs", "toml"]
python = ["py", "pyi", "pyw", "ipynb"]
javascript = ["js", "mjs", "cjs", "jsx"]
typescript = ["ts", "tsx", "d.ts"]
java = ["java", "jar", "class"]
csharp = ["cs", "csx"]
cpp = ["cpp", "cc", "cxx", "c++", "hpp", "hxx", "h++"]
go = ["go"]
ruby = ["rb", "erb"]
php = ["php", "phtml"]
swift = ["swift"]
kotlin = ["kt", "kts"]
nix = ["nix"]

markup = ["html", "htm", "xhtml", "xml", "svg", "vue", "wasm", "ejs"]
style = ["css", "scss", "sass", "less", "styl"]
web_config = ["json", "json5", "yaml", "yml", "toml", "ini", "conf", "config"]

shell = ["sh", "bash", "zsh", "fish", "ps1", "psm1", "psd1"]
script = ["pl", "pm", "t", "tcl", "lua", "vim", "vimrc", "r"]

doc = [
  "md",
  "rst",
  "txt",
  "org",
  "wiki",
  "adoc",
  "tex",
  "pdf",
  "epub",
  "doc",
  "docx",
  "rtf",
]

image = ["png", "jpg", "jpeg", "gif", "bmp", "tiff", "webp", "ico", "heic"]
video = ["mp4", "webm", "mov", "avi", "mkv", "flv", "wmv", "m4v", "3gp"]
audio = ["mp3", "wav", "ogg", "m4a", "flac", "aac", "wma"]

data = ["csv", "tsv", "sql", "sqlite", "db", "json", "xml", "yaml", "yml"]
archive = ["zip", "tar", "gz", "bz2", "xz", "7z", "rar", "iso", "dmg"]

[extensions.colors]
rust = "#ab154c"
python = "#883136"
javascript = "#2b2833"
typescript = "#5c594e"
java = "#ab154c"
csharp = "#883136"
cpp = "#ab154c"
go = "#5c594e"
ruby = "#ab154c"
php = "#883136"
swift = "#ab154c"
kotlin = "#883136"
nix = "#5c594e"

markup = "#ab154c"
style = "#883136"
web_config = "#572730"

shell = "#883136"
script = "#572730"

doc = "#2b2833"

image = "#ae1616"
video = "#ae1616"
audio = "#ae1616"

data = "#572730"
archive = "#ab154c"

rs = "#ab154c"
py = "#883136"
js = "#2b2833"
ts = "#5c594e"
jsx = "#2b2833"
tsx = "#5c594e"
vue = "#883136"
css = "#883136"
scss = "#883136"
html = "#ab154c"
md = "#2b2833"
json = "#572730"
yaml = "#572730"
toml = "#572730"
sql = "#5c594e"
