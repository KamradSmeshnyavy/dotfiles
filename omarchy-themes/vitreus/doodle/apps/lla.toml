name = "omarchy"
author = "Mohamed Achaq"
description = "A soothing pastel theme for the high-spirited, featuring warm, cozy colors"

[colors]
file = "#22202e"
directory = "#5a2541"
symlink = "#c22f63"
executable = "#813254"

size = "#6b6577"
date = "#6b6577"
user = "#db1f25"
group = "#6b6577"

permission_dir = "#5a2541"
permission_read = "#813254"
permission_write = "#db1f25"
permission_exec = "#db1f25"
permission_none = "#6b6577"

[special_files]
[special_files.folders]
"node_modules" = { h = 0, s = 0, l = 0.15 }
"target" = "#6b6577"
"dist" = "#6b6577"
".git" = "#5a2541"
"build" = "#6b6577"
".cache" = "#6b6577"
"*-env" = "#813254"
"venv" = "#813254"
".env" = "#813254"
"*.d" = "#c22f63"
"*_cache" = "#6b6577"
"*-cache" = "#6b6577"

[special_files.dotfiles]
".gitignore" = "#6b6577"
".env" = "#5a2541"
".dockerignore" = "#6b6577"
".editorconfig" = "#6b6577"
".prettierrc" = "#6b6577"
".eslintrc" = "#6b6577"
".babelrc" = "#6b6577"

[special_files.exact_match]
"Dockerfile" = "#6b6577"
"docker-compose.yml" = "#6b6577"
"Makefile" = "#db1f25"
"CMakeLists.txt" = "#db1f25"
"README.md" = "#5a2541"
"LICENSE" = "#5a2541"
"package.json" = "#5a2541"
"Cargo.toml" = "#db1f25"
"go.mod" = "#6b6577"
"flake.nix" = "#5a2541"
"flake.lock" = "#6b6577"
"shell.nix" = "#5a2541"
"default.nix" = "#5a2541"

[special_files.patterns]
"*rc" = "#6b6577"
"*.min.*" = "#6b6577"
"*.test.*" = "#813254"
"*.spec.*" = "#813254"
"*.lock" = "#6b6577"
"*.config.*" = "#6b6577"

[extensions.groups]
rust = ["rs", "toml"]
python = ["py", "pyi", "pyw", "ipynb"]
javascript = ["js", "mjs", "cjs", "jsx"]
typescript = ["ts", "tsx", "d.ts"]
java = ["java", "jar", "class"]
csharp = ["cs", "csx"]
cpp = ["cpp", "cc", "cxx", "c++", "hpp", "hxx", "h++"]
go = ["go"]
ruby = ["rb", "erb"]
php = ["php", "phtml"]
swift = ["swift"]
kotlin = ["kt", "kts"]
nix = ["nix"]

markup = ["html", "htm", "xhtml", "xml", "svg", "vue", "wasm", "ejs"]
style = ["css", "scss", "sass", "less", "styl"]
web_config = ["json", "json5", "yaml", "yml", "toml", "ini", "conf", "config"]

shell = ["sh", "bash", "zsh", "fish", "ps1", "psm1", "psd1"]
script = ["pl", "pm", "t", "tcl", "lua", "vim", "vimrc", "r"]

doc = [
  "md",
  "rst",
  "txt",
  "org",
  "wiki",
  "adoc",
  "tex",
  "pdf",
  "epub",
  "doc",
  "docx",
  "rtf",
]

image = ["png", "jpg", "jpeg", "gif", "bmp", "tiff", "webp", "ico", "heic"]
video = ["mp4", "webm", "mov", "avi", "mkv", "flv", "wmv", "m4v", "3gp"]
audio = ["mp3", "wav", "ogg", "m4a", "flac", "aac", "wma"]

data = ["csv", "tsv", "sql", "sqlite", "db", "json", "xml", "yaml", "yml"]
archive = ["zip", "tar", "gz", "bz2", "xz", "7z", "rar", "iso", "dmg"]

[extensions.colors]
rust = "#db1f25"
python = "#813254"
javascript = "#22202e"
typescript = "#6b6577"
java = "#db1f25"
csharp = "#813254"
cpp = "#db1f25"
go = "#6b6577"
ruby = "#db1f25"
php = "#813254"
swift = "#db1f25"
kotlin = "#813254"
nix = "#6b6577"

markup = "#db1f25"
style = "#813254"
web_config = "#5a2541"

shell = "#813254"
script = "#5a2541"

doc = "#22202e"

image = "#d42361"
video = "#d42361"
audio = "#d42361"

data = "#5a2541"
archive = "#db1f25"

rs = "#db1f25"
py = "#813254"
js = "#22202e"
ts = "#6b6577"
jsx = "#22202e"
tsx = "#6b6577"
vue = "#813254"
css = "#813254"
scss = "#813254"
html = "#db1f25"
md = "#22202e"
json = "#5a2541"
yaml = "#5a2541"
toml = "#5a2541"
sql = "#6b6577"
