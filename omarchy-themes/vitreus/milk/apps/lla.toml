name = "omarchy"
author = "Mohamed Achaq"
description = "A soothing pastel theme for the high-spirited, featuring warm, cozy colors"

[colors]
file = "#45495c"
directory = "#5862a2"
symlink = "#4756e1"
executable = "#525eb9"

size = "#7982a1"
date = "#7982a1"
user = "#c7173c"
group = "#7982a1"

permission_dir = "#5862a2"
permission_read = "#525eb9"
permission_write = "#c7173c"
permission_exec = "#c7173c"
permission_none = "#7982a1"

[special_files]
[special_files.folders]
"node_modules" = { h = 0, s = 0, l = 0.15 }
"target" = "#7982a1"
"dist" = "#7982a1"
".git" = "#5862a2"
"build" = "#7982a1"
".cache" = "#7982a1"
"*-env" = "#525eb9"
"venv" = "#525eb9"
".env" = "#525eb9"
"*.d" = "#4756e1"
"*_cache" = "#7982a1"
"*-cache" = "#7982a1"

[special_files.dotfiles]
".gitignore" = "#5b6482"
".env" = "#5862a2"
".dockerignore" = "#5b6482"
".editorconfig" = "#5b6482"
".prettierrc" = "#5b6482"
".eslintrc" = "#5b6482"
".babelrc" = "#5b6482"

[special_files.exact_match]
"Dockerfile" = "#5b6482"
"docker-compose.yml" = "#5b6482"
"Makefile" = "#c7173c"
"CMakeLists.txt" = "#c7173c"
"README.md" = "#5862a2"
"LICENSE" = "#5862a2"
"package.json" = "#5862a2"
"Cargo.toml" = "#c7173c"
"go.mod" = "#5b6482"
"flake.nix" = "#5862a2"
"flake.lock" = "#7982a1"
"shell.nix" = "#5862a2"
"default.nix" = "#5862a2"

[special_files.patterns]
"*rc" = "#5b6482"
"*.min.*" = "#7982a1"
"*.test.*" = "#525eb9"
"*.spec.*" = "#525eb9"
"*.lock" = "#7982a1"
"*.config.*" = "#5b6482"

[extensions.groups]
rust = ["rs", "toml"]
python = ["py", "pyi", "pyw", "ipynb"]
javascript = ["js", "mjs", "cjs", "jsx"]
typescript = ["ts", "tsx", "d.ts"]
java = ["java", "jar", "class"]
csharp = ["cs", "csx"]
cpp = ["cpp", "cc", "cxx", "c++", "hpp", "hxx", "h++"]
go = ["go"]
ruby = ["rb", "erb"]
php = ["php", "phtml"]
swift = ["swift"]
kotlin = ["kt", "kts"]
nix = ["nix"]

markup = ["html", "htm", "xhtml", "xml", "svg", "vue", "wasm", "ejs"]
style = ["css", "scss", "sass", "less", "styl"]
web_config = ["json", "json5", "yaml", "yml", "toml", "ini", "conf", "config"]

shell = ["sh", "bash", "zsh", "fish", "ps1", "psm1", "psd1"]
script = ["pl", "pm", "t", "tcl", "lua", "vim", "vimrc", "r"]

doc = [
  "md",
  "rst",
  "txt",
  "org",
  "wiki",
  "adoc",
  "tex",
  "pdf",
  "epub",
  "doc",
  "docx",
  "rtf",
]

image = ["png", "jpg", "jpeg", "gif", "bmp", "tiff", "webp", "ico", "heic"]
video = ["mp4", "webm", "mov", "avi", "mkv", "flv", "wmv", "m4v", "3gp"]
audio = ["mp3", "wav", "ogg", "m4a", "flac", "aac", "wma"]

data = ["csv", "tsv", "sql", "sqlite", "db", "json", "xml", "yaml", "yml"]
archive = ["zip", "tar", "gz", "bz2", "xz", "7z", "rar", "iso", "dmg"]

[extensions.colors]
rust = "#c7173c"
python = "#525eb9"
javascript = "#5f657f"
typescript = "#5b6482"
java = "#c7173c"
csharp = "#525eb9"
cpp = "#c7173c"
go = "#5b6482"
ruby = "#c7173c"
php = "#525eb9"
swift = "#c7173c"
kotlin = "#525eb9"
nix = "#5b6482"

markup = "#c7173c"
style = "#525eb9"
web_config = "#5862a2"

shell = "#525eb9"
script = "#5862a2"

doc = "#45495c"

image = "#384cff"
video = "#384cff"
audio = "#384cff"

data = "#5862a2"
archive = "#c7173c"

rs = "#c7173c"
py = "#525eb9"
js = "#5f657f"
ts = "#5b6482"
jsx = "#5f657f"
tsx = "#5b6482"
vue = "#525eb9"
css = "#525eb9"
scss = "#525eb9"
html = "#c7173c"
md = "#45495c"
json = "#5862a2"
yaml = "#5862a2"
toml = "#5862a2"
sql = "#5b6482"
