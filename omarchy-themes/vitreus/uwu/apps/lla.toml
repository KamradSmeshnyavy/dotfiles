name = "omarchy"
author = "Mohamed Achaq"
description = "A soothing pastel theme for the high-spirited, featuring warm, cozy colors"

[colors]
file = "#3a2a8c"
directory = "#712686"
symlink = "#c01c6f"
executable = "#9c3493"

size = "#7a6ad0"
date = "#7a6ad0"
user = "#cc0033"
group = "#7a6ad0"

permission_dir = "#712686"
permission_read = "#9c3493"
permission_write = "#cc0033"
permission_exec = "#cc0033"
permission_none = "#7a6ad0"

[special_files]
[special_files.folders]
"node_modules" = { h = 0, s = 0, l = 0.15 }
"target" = "#7a6ad0"
"dist" = "#7a6ad0"
".git" = "#712686"
"build" = "#7a6ad0"
".cache" = "#7a6ad0"
"*-env" = "#9c3493"
"venv" = "#9c3493"
".env" = "#9c3493"
"*.d" = "#c01c6f"
"*_cache" = "#7a6ad0"
"*-cache" = "#7a6ad0"

[special_files.dotfiles]
".gitignore" = "#6553c9"
".env" = "#712686"
".dockerignore" = "#6553c9"
".editorconfig" = "#6553c9"
".prettierrc" = "#6553c9"
".eslintrc" = "#6553c9"
".babelrc" = "#6553c9"

[special_files.exact_match]
"Dockerfile" = "#6553c9"
"docker-compose.yml" = "#6553c9"
"Makefile" = "#cc0033"
"CMakeLists.txt" = "#cc0033"
"README.md" = "#712686"
"LICENSE" = "#712686"
"package.json" = "#712686"
"Cargo.toml" = "#cc0033"
"go.mod" = "#6553c9"
"flake.nix" = "#712686"
"flake.lock" = "#7a6ad0"
"shell.nix" = "#712686"
"default.nix" = "#712686"

[special_files.patterns]
"*rc" = "#6553c9"
"*.min.*" = "#7a6ad0"
"*.test.*" = "#9c3493"
"*.spec.*" = "#9c3493"
"*.lock" = "#7a6ad0"
"*.config.*" = "#6553c9"

[extensions.groups]
rust = ["rs", "toml"]
python = ["py", "pyi", "pyw", "ipynb"]
javascript = ["js", "mjs", "cjs", "jsx"]
typescript = ["ts", "tsx", "d.ts"]
java = ["java", "jar", "class"]
csharp = ["cs", "csx"]
cpp = ["cpp", "cc", "cxx", "c++", "hpp", "hxx", "h++"]
go = ["go"]
ruby = ["rb", "erb"]
php = ["php", "phtml"]
swift = ["swift"]
kotlin = ["kt", "kts"]
nix = ["nix"]

markup = ["html", "htm", "xhtml", "xml", "svg", "vue", "wasm", "ejs"]
style = ["css", "scss", "sass", "less", "styl"]
web_config = ["json", "json5", "yaml", "yml", "toml", "ini", "conf", "config"]

shell = ["sh", "bash", "zsh", "fish", "ps1", "psm1", "psd1"]
script = ["pl", "pm", "t", "tcl", "lua", "vim", "vimrc", "r"]

doc = [
  "md",
  "rst",
  "txt",
  "org",
  "wiki",
  "adoc",
  "tex",
  "pdf",
  "epub",
  "doc",
  "docx",
  "rtf",
]

image = ["png", "jpg", "jpeg", "gif", "bmp", "tiff", "webp", "ico", "heic"]
video = ["mp4", "webm", "mov", "avi", "mkv", "flv", "wmv", "m4v", "3gp"]
audio = ["mp3", "wav", "ogg", "m4a", "flac", "aac", "wma"]

data = ["csv", "tsv", "sql", "sqlite", "db", "json", "xml", "yaml", "yml"]
archive = ["zip", "tar", "gz", "bz2", "xz", "7z", "rar", "iso", "dmg"]

[extensions.colors]
rust = "#cc0033"
python = "#9c3493"
javascript = "#3a2a8c"
typescript = "#6553c9"
java = "#cc0033"
csharp = "#9c3493"
cpp = "#cc0033"
go = "#6553c9"
ruby = "#cc0033"
php = "#9c3493"
swift = "#cc0033"
kotlin = "#9c3493"
nix = "#6553c9"

markup = "#cc0033"
style = "#9c3493"
web_config = "#712686"

shell = "#9c3493"
script = "#712686"

doc = "#3a2a8c"

image = "#c7005f"
video = "#c7005f"
audio = "#c7005f"

data = "#712686"
archive = "#cc0033"

rs = "#cc0033"
py = "#9c3493"
js = "#3a2a8c"
ts = "#6553c9"
jsx = "#3a2a8c"
tsx = "#6553c9"
vue = "#9c3493"
css = "#9c3493"
scss = "#9c3493"
html = "#cc0033"
md = "#3a2a8c"
json = "#712686"
yaml = "#712686"
toml = "#712686"
sql = "#6553c9"
