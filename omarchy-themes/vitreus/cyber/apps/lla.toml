name = "omarchy"
author = "Mohamed Achaq"
description = "A soothing pastel theme for the high-spirited, featuring warm, cozy colors"

[colors]
file = "#d6f7ff"
directory = "#b7f6ff"
symlink = "#7df3ff"
executable = "#6beeff"

size = "#6f93a8"
date = "#6f93a8"
user = "#ff3b5c"
group = "#6f93a8"

permission_dir = "#b7f6ff"
permission_read = "#6beeff"
permission_write = "#ff3b5c"
permission_exec = "#ff3b5c"
permission_none = "#6f93a8"

[special_files]
[special_files.folders]
"node_modules" = { h = 0, s = 0, l = 0.15 }
"target" = "#6f93a8"
"dist" = "#6f93a8"
".git" = "#b7f6ff"
"build" = "#6f93a8"
".cache" = "#6f93a8"
"*-env" = "#6beeff"
"venv" = "#6beeff"
".env" = "#6beeff"
"*.d" = "#7df3ff"
"*_cache" = "#6f93a8"
"*-cache" = "#6f93a8"

[special_files.dotfiles]
".gitignore" = "#6f93a8"
".env" = "#b7f6ff"
".dockerignore" = "#6f93a8"
".editorconfig" = "#6f93a8"
".prettierrc" = "#6f93a8"
".eslintrc" = "#6f93a8"
".babelrc" = "#6f93a8"

[special_files.exact_match]
"Dockerfile" = "#6f93a8"
"docker-compose.yml" = "#6f93a8"
"Makefile" = "#ff3b5c"
"CMakeLists.txt" = "#ff3b5c"
"README.md" = "#b7f6ff"
"LICENSE" = "#b7f6ff"
"package.json" = "#b7f6ff"
"Cargo.toml" = "#ff3b5c"
"go.mod" = "#6f93a8"
"flake.nix" = "#b7f6ff"
"flake.lock" = "#6f93a8"
"shell.nix" = "#b7f6ff"
"default.nix" = "#b7f6ff"

[special_files.patterns]
"*rc" = "#6f93a8"
"*.min.*" = "#6f93a8"
"*.test.*" = "#6beeff"
"*.spec.*" = "#6beeff"
"*.lock" = "#6f93a8"
"*.config.*" = "#6f93a8"

[extensions.groups]
rust = ["rs", "toml"]
python = ["py", "pyi", "pyw", "ipynb"]
javascript = ["js", "mjs", "cjs", "jsx"]
typescript = ["ts", "tsx", "d.ts"]
java = ["java", "jar", "class"]
csharp = ["cs", "csx"]
cpp = ["cpp", "cc", "cxx", "c++", "hpp", "hxx", "h++"]
go = ["go"]
ruby = ["rb", "erb"]
php = ["php", "phtml"]
swift = ["swift"]
kotlin = ["kt", "kts"]
nix = ["nix"]

markup = ["html", "htm", "xhtml", "xml", "svg", "vue", "wasm", "ejs"]
style = ["css", "scss", "sass", "less", "styl"]
web_config = ["json", "json5", "yaml", "yml", "toml", "ini", "conf", "config"]

shell = ["sh", "bash", "zsh", "fish", "ps1", "psm1", "psd1"]
script = ["pl", "pm", "t", "tcl", "lua", "vim", "vimrc", "r"]

doc = [
  "md",
  "rst",
  "txt",
  "org",
  "wiki",
  "adoc",
  "tex",
  "pdf",
  "epub",
  "doc",
  "docx",
  "rtf",
]

image = ["png", "jpg", "jpeg", "gif", "bmp", "tiff", "webp", "ico", "heic"]
video = ["mp4", "webm", "mov", "avi", "mkv", "flv", "wmv", "m4v", "3gp"]
audio = ["mp3", "wav", "ogg", "m4a", "flac", "aac", "wma"]

data = ["csv", "tsv", "sql", "sqlite", "db", "json", "xml", "yaml", "yml"]
archive = ["zip", "tar", "gz", "bz2", "xz", "7z", "rar", "iso", "dmg"]

[extensions.colors]
rust = "#ff3b5c"
python = "#6beeff"
javascript = "#d6f7ff"
typescript = "#6f93a8"
java = "#ff3b5c"
csharp = "#6beeff"
cpp = "#ff3b5c"
go = "#6f93a8"
ruby = "#ff3b5c"
php = "#6beeff"
swift = "#ff3b5c"
kotlin = "#6beeff"
nix = "#6f93a8"

markup = "#ff3b5c"
style = "#6beeff"
web_config = "#b7f6ff"

shell = "#6beeff"
script = "#b7f6ff"

doc = "#d6f7ff"

image = "#00e5ff"
video = "#00e5ff"
audio = "#00e5ff"

data = "#b7f6ff"
archive = "#ff3b5c"

rs = "#ff3b5c"
py = "#6beeff"
js = "#d6f7ff"
ts = "#6f93a8"
jsx = "#d6f7ff"
tsx = "#6f93a8"
vue = "#6beeff"
css = "#6beeff"
scss = "#6beeff"
html = "#ff3b5c"
md = "#d6f7ff"
json = "#b7f6ff"
yaml = "#b7f6ff"
toml = "#b7f6ff"
sql = "#6f93a8"
