name = "omarchy"
author = "Mohamed Achaq"
description = "A soothing pastel theme for the high-spirited, featuring warm, cozy colors"

[colors]
file = "#3b3631"
directory = "#424c5d"
symlink = "#446597"
executable = "#52637d"

size = "#857b6c"
date = "#857b6c"
user = "#bd3429"
group = "#857b6c"

permission_dir = "#424c5d"
permission_read = "#52637d"
permission_write = "#bd3429"
permission_exec = "#bd3429"
permission_none = "#857b6c"

[special_files]
[special_files.folders]
"node_modules" = { h = 0, s = 0, l = 0.15 }
"target" = "#857b6c"
"dist" = "#857b6c"
".git" = "#424c5d"
"build" = "#857b6c"
".cache" = "#857b6c"
"*-env" = "#52637d"
"venv" = "#52637d"
".env" = "#52637d"
"*.d" = "#446597"
"*_cache" = "#857b6c"
"*-cache" = "#857b6c"

[special_files.dotfiles]
".gitignore" = "#6c6457"
".env" = "#424c5d"
".dockerignore" = "#6c6457"
".editorconfig" = "#6c6457"
".prettierrc" = "#6c6457"
".eslintrc" = "#6c6457"
".babelrc" = "#6c6457"

[special_files.exact_match]
"Dockerfile" = "#6c6457"
"docker-compose.yml" = "#6c6457"
"Makefile" = "#bd3429"
"CMakeLists.txt" = "#bd3429"
"README.md" = "#424c5d"
"LICENSE" = "#424c5d"
"package.json" = "#424c5d"
"Cargo.toml" = "#bd3429"
"go.mod" = "#6c6457"
"flake.nix" = "#424c5d"
"flake.lock" = "#857b6c"
"shell.nix" = "#424c5d"
"default.nix" = "#424c5d"

[special_files.patterns]
"*rc" = "#6c6457"
"*.min.*" = "#857b6c"
"*.test.*" = "#52637d"
"*.spec.*" = "#52637d"
"*.lock" = "#857b6c"
"*.config.*" = "#6c6457"

[extensions.groups]
rust = ["rs", "toml"]
python = ["py", "pyi", "pyw", "ipynb"]
javascript = ["js", "mjs", "cjs", "jsx"]
typescript = ["ts", "tsx", "d.ts"]
java = ["java", "jar", "class"]
csharp = ["cs", "csx"]
cpp = ["cpp", "cc", "cxx", "c++", "hpp", "hxx", "h++"]
go = ["go"]
ruby = ["rb", "erb"]
php = ["php", "phtml"]
swift = ["swift"]
kotlin = ["kt", "kts"]
nix = ["nix"]

markup = ["html", "htm", "xhtml", "xml", "svg", "vue", "wasm", "ejs"]
style = ["css", "scss", "sass", "less", "styl"]
web_config = ["json", "json5", "yaml", "yml", "toml", "ini", "conf", "config"]

shell = ["sh", "bash", "zsh", "fish", "ps1", "psm1", "psd1"]
script = ["pl", "pm", "t", "tcl", "lua", "vim", "vimrc", "r"]

doc = [
  "md",
  "rst",
  "txt",
  "org",
  "wiki",
  "adoc",
  "tex",
  "pdf",
  "epub",
  "doc",
  "docx",
  "rtf",
]

image = ["png", "jpg", "jpeg", "gif", "bmp", "tiff", "webp", "ico", "heic"]
video = ["mp4", "webm", "mov", "avi", "mkv", "flv", "wmv", "m4v", "3gp"]
audio = ["mp3", "wav", "ogg", "m4a", "flac", "aac", "wma"]

data = ["csv", "tsv", "sql", "sqlite", "db", "json", "xml", "yaml", "yml"]
archive = ["zip", "tar", "gz", "bz2", "xz", "7z", "rar", "iso", "dmg"]

[extensions.colors]
rust = "#bd3429"
python = "#52637d"
javascript = "#3b3631"
typescript = "#6c6457"
java = "#bd3429"
csharp = "#52637d"
cpp = "#bd3429"
go = "#6c6457"
ruby = "#bd3429"
php = "#52637d"
swift = "#bd3429"
kotlin = "#52637d"
nix = "#6c6457"

markup = "#bd3429"
style = "#52637d"
web_config = "#424c5d"

shell = "#52637d"
script = "#424c5d"

doc = "#3b3631"

image = "#3c66a5"
video = "#3c66a5"
audio = "#3c66a5"

data = "#424c5d"
archive = "#bd3429"

rs = "#bd3429"
py = "#52637d"
js = "#3b3631"
ts = "#6c6457"
jsx = "#3b3631"
tsx = "#6c6457"
vue = "#52637d"
css = "#52637d"
scss = "#52637d"
html = "#bd3429"
md = "#3b3631"
json = "#424c5d"
yaml = "#424c5d"
toml = "#424c5d"
sql = "#6c6457"
