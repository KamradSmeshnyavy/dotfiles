# # Source the theme.conf which contains color definitions
# source-file ~/.config/tmux/theme.conf
# Загружаем переменные темы Omarchy
if-shell 'test -f ~/.config/tmux/om-theme.conf' {
  source-file ~/.config/tmux/om-theme.conf
}
# Цвета приложения от темы Omarchy (слот omarchy-app-themes), перекрывают om-theme.conf
if-shell 'test -f ~/.config/tmux/om-app-theme.conf' {
  source-file ~/.config/tmux/om-app-theme.conf
}
# Load keybindings
source-file ~/.config/tmux/keybind.conf

# Включает поддержку расширенных клавиш (Kitty Keyboard Protocol)
set -as terminal-features ',xterm-kitty:extkeys'
set -as terminal-features ',kitty:extkeys'
# Ссылки OSC 8 (kitten hyperlinked-grep в nushell) пропускать в kitty
set -as terminal-features ',xterm-kitty:hyperlinks'
set -g default-terminal "xterm-kitty"
# tmux 3.8 красит попапы своей темой (themedarkgrey) — вернуть цвета терминала
set -g popup-style default
set -g popup-border-style default

set -g update-environment "DISPLAY SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY TERM_PROGRAM"

set-environment -g TERM_PROGRAM "kitty"
# Передавать escape-последовательности напрямую
set -s extended-keys on

set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -s escape-time 0
set -g history-limit 30000
set -g display-time 2000
set -g focus-events on
setw -g aggressive-resize on
set -g set-clipboard external
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set -g detach-on-destroy off
# set -g default-shell /sbin/nu
# set -g default-command "/sbin/nu -l"
# set -as terminal-features 'xterm*:extkeys'

# ╭───────────────────────────────────────────────────────╮
# │                      plugins                          │
# ╰───────────────────────────────────────────────────────╯
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'#TODO:check
set -g @plugin 'wfxr/tmux-fzf-url'#TODO:check
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'omerxx/tmux-floax'
# set -g @plugin 'christoomey/vim-tmux-navigator'
# floax
set -g @plugin 'omerxx/tmux-floax'
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'pink'
set -g @floax-text-color 'white'
set -g @floax-bind '-n M-f'
# set -g @floax-bind '-n M-p'
set -g @floax-change-path 'false'
# flash-copy
set -g @plugin 'kristijan/flash-copy.tmux'

#set -g @plugin 'jeffnguyen695/tmux-zoxide-session'#TODO:check

set -g @sessionx-bind-zo-new-window 'ctrl-y'
set -g @sessionx-auto-accept 'off'
# set -g @sessionx-custom-paths '/Users/kamradsmeshnyavy/dotfiles'
set -g @sessionx-custom-paths '/home/kamradsmeshnyavy/dotfiles'
set -g @sessionx-bind '-T SESSION_MODE y'
set -g @sessionx-x-path '~/dotfiles'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-custom-paths-subdirectories 'false'
set -g @sessionx-filter-current 'false'

set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'

# set -g @plugin 'Morantron/tmux-fingers'
# run-shell ~/dotfiles/tmux/plugins/tmux-fingers/tmux-fingers.tmux
# set -g @fingers-key '-T PANE_MODE f'

set -g @plugin 'schasse/tmux-jump'
set -g @jump-key 's'
set -g @jump-bg-color '\e[0m\e[90m'
set -g @jump-fg-color '\e[1m\e[31m'
set -g @jump-keys-position 'left'


