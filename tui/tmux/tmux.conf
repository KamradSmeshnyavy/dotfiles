set -g pane-border-status top
set -g pane-border-format "#P"
set -g pane-border-lines simple
# Рамки панелей и статусбар — как у Efterklang (tui_cli/tmux/tmux.conf), цвета — @om_* темы Omarchy
set -g pane-border-style "bg=default,fg=#{@om_overlay0}"
set -g pane-active-border-style "bg=default,fg=#{@om_blue}"
# status bar
set -g status-position top
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "right"

set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"

set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"

set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

set -g @catppuccin_directory_text "#{pane_current_path}"

# set -g @catppuccin_flavor "mocha"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"

set -g status-left-length 100
set -g status-style "bg=default"
set -g status-justify "absolute-centre"

# Слева: сессия (красная при prefix), путь, zoom
set -g status-left ""
set -ga status-left "#{?client_prefix,#{#[fg=#{@om_red},bold]  #S },#{#[fg=#{@om_green}]  #S }}"
set -ga status-left "#[fg=#{@om_overlay0},none]│"
set -ga status-left "#[fg=#{@om_blue}]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} "
set -ga status-left "#[fg=#{@om_overlay0},none]#{?window_zoomed_flag,│,}"
set -ga status-left "#[fg=#{@om_yellow}]#{?window_zoomed_flag,  zoom ,}"

# По центру: окна
set -wg automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"
set -g window-status-format " #W "
set -g window-status-style "fg=#{@om_fg}"
set -g window-status-last-style "fg=#{@om_fg}"
set -g window-status-activity-style "fg=#{@om_red}"
set -g window-status-bell-style "fg=#{@om_red},bold"
set -gF window-status-separator "#[fg=#{@om_overlay0}]│"
set -g window-status-current-format " #W "
set -g window-status-current-style "fg=#{@om_magenta},bold"

# Справа: текущая команда и таблица клавиш
set -g status-right ""
set -ga status-right "#[fg=#{@om_maroon}]  #{pane_current_command} #{?#{==:#{client_key_table},root},NORMAL,#{client_key_table}} "

# Initialize TMUX plugin manager;
run '~/.config/tmux/plugins/tpm/tpm'

