<h2 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">Interactive cheat sheet for a 7-layer custom Kanata keyboard layout, with color-coded key categories and a combo reference.</h2>
<style>
.tab-btn{font:12px var(--font-sans);padding:6px 10px;border:0.5px solid var(--border);border-radius:8px;background:var(--surface-1);color:var(--text-secondary);cursor:pointer}
.tab-btn:hover{border-color:var(--border-strong)}
.tab-btn.active{border-color:var(--text-accent);color:var(--text-accent)}
</style>
<div style="font-size:14px;font-weight:500;color:var(--text-primary);padding-bottom:8px">Legend</div>
<div id="legend" style="display:flex;flex-wrap:wrap;gap:10px 18px;padding-bottom:16px;font-size:12px;color:var(--text-secondary)"></div>
<div style="font-size:14px;font-weight:500;color:var(--text-primary);padding-bottom:8px">Layer</div>
<div id="tabs" style="display:flex;flex-wrap:wrap;gap:6px;padding-bottom:6px"></div>
<div style="font-size:12px;color:var(--text-muted);padding-bottom:12px">Tip: holding Nav + Sym together reaches Fun (F-keys, system)</div>
<div id="board"></div>
<div style="font-size:14px;font-weight:500;color:var(--text-primary);padding:18px 0 10px">Combos / chords</div>
<div id="combos" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px 16px"></div>
<script>
const svgNS='http://www.w3.org/2000/svg';
const CATS={normal:'gray',homerow:'teal',hyper:'purple',oneshot:'amber',macro:'green',special:'coral',transparent:'gray'};
const M={ctrl:'Ctrl',alt:'Alt',shift:'Sft',super:'Sup',hyper:'Hyp'};
const ROWSPECS=[{l:6,r:6,w:38},{l:5,r:8,w:38},{l:5,r:6,w:38},{l:5,r:5,w:38},{l:2,r:2,w:90}];
const LAYERS={
def:{name:'Def',rows:[
 {l:['1','2','3','4','5','6'],r:['7','8','9','0','-','=']},
 {l:['Q','W','E','R','T'],r:['Y','U','I','O','P','[',']','\\']},
 {l:[{l:'A',s:M.ctrl,c:'homerow'},{l:'S',s:M.alt,c:'homerow'},{l:'D',s:M.shift,c:'homerow'},{l:'F',s:M.super,c:'homerow'},{l:'G',s:M.hyper,c:'hyper'}],
  r:[{l:'H',s:M.hyper,c:'hyper'},{l:'J',s:M.super,c:'homerow'},{l:'K',s:M.shift,c:'homerow'},{l:'L',s:M.alt,c:'homerow'},{l:';',s:M.ctrl,c:'homerow'},{l:"'"}]},
 {l:[{l:'Z',s:'Fn',c:'special'},{l:'X'},{l:'C',s:'Num',c:'special'},{l:'V'},{l:'B'}],r:[{l:'N'},{l:'M'},{l:','},{l:'.'},{l:'/'}]},
 {l:[{l:'Num',c:'special'},{l:'Nav',c:'special'}],r:[{l:'Space'},{l:'Sym',c:'special'}]}
]},
nomods:{name:'Nomods',rows:[
 {l:[{l:'Dim'},{l:'Bright'},{e:1},{e:1},{e:1},{e:1}],r:[{l:'Prev'},{l:'Play'},{l:'Next'},{l:'Mute'},{l:'Vol−'},{l:'Vol+'}]},
 {l:['q','w','e','r','t'],r:['y','u','i','o','p','[',']','\\']},
 {l:['a','s',{l:'d',s:M.shift,c:'oneshot'},'f','g'],r:['h','j',{l:'k',s:M.shift,c:'oneshot'},'l',';',"'"]},
 {l:['z','x','c','v','b'],r:['n','m',',','.','/']},
 {l:[{c:'transparent'},{c:'transparent'}],r:[{c:'transparent'},{c:'transparent'}]}
]},
num:{name:'Num',rows:[
 {l:['F1','F2','F3','F4','F5','F6'],r:['F7','F8','F9','F10','F11','F12']},
 {l:[{e:1},{e:1},{e:1},{l:'r$',c:'macro'},{e:1}],r:[{l:'+'},{l:'7'},{l:'8'},{l:'9'},{l:'*'},{e:1},{e:1},{e:1}]},
 {l:[{l:M.ctrl,c:'oneshot'},{l:M.alt,c:'oneshot'},{l:M.shift,c:'oneshot'},{l:M.super,c:'oneshot'},{l:'Bspc'}],r:[{l:'-'},{l:'4'},{l:'5'},{l:'6'},{l:'/'},{e:1}]},
 {l:[{e:1},{l:M.shift,c:'oneshot'},{e:1},{l:'000',c:'macro'},{l:',00',c:'macro'}],r:[{l:','},{l:'1'},{l:'2'},{l:'3'},{l:'.'}]},
 {l:[{c:'transparent'},{l:'→Nav',c:'special'}],r:[{l:'→Def',c:'special'},{l:'Sym',c:'special'}]}
]},
nav:{name:'Nav',rows:[
 {l:['F1','F2','F3','F4','F5','F6'],r:['F7','F8','F9','F10','F11','F12']},
 {l:[{l:'Tab'},{l:'Swap',c:'special'},{l:'Tab',s:'C-S',c:'macro'},{l:'Tab',s:'Ctrl',c:'macro'},{l:'←',s:'Meta',c:'macro'}],r:[{l:'PgUp'},{l:'Home'},{l:'Esc'},{l:'End'},{l:'Bspc'},{l:'Play'},{e:1},{e:1}]},
 {l:[{l:M.ctrl,c:'oneshot'},{l:M.alt,c:'oneshot'},{l:M.shift,c:'oneshot'},{l:M.super,c:'oneshot'},{l:'→',s:'Meta',c:'macro'}],r:[{l:'←'},{l:'↓'},{l:'↑'},{l:'→'},{l:'Ent'},{e:1}]},
 {l:[{l:'Z',s:'Ctrl',c:'macro'},{l:'X',s:'Ctrl',c:'macro'},{l:'C',s:'Ctrl',c:'macro'},{l:'V',s:'Ctrl',c:'macro'},{l:'F18'}],r:[{l:'PgDn'},{l:'F19'},{l:'Vol−'},{l:'Vol+'},{l:'Del'}]},
 {l:[{c:'transparent'},{c:'transparent'}],r:[{c:'transparent'},{c:'transparent'}]}
]},
sym:{name:'Sym',rows:[
 {l:['F1','F2','F3','F4','F5','F6'],r:['F7','F8','F9','F10','F11','F12']},
 {l:[{l:'Esc'},{l:'{'},{l:'['},{l:'('},{l:'%'}],r:[{l:'&'},{l:')'},{l:']'},{l:'}'},{l:'"'},{e:1},{e:1},{e:1}]},
 {l:[{l:'-'},{l:'^'},{l:'\`'},{l:'~'},{l:'$'}],r:[{l:'#'},{l:M.super,c:'oneshot'},{l:M.shift,c:'oneshot'},{l:M.alt,c:'oneshot'},{l:M.ctrl,c:'oneshot'},{e:1}]},
 {l:[{l:'+'},{l:'='},{l:'*'},{l:'⁄'},{l:'@'}],r:[{l:'|'},{l:'\\'},{l:'?'},{l:'!'},{l:':'}]},
 {l:[{c:'transparent'},{c:'transparent'}],r:[{l:'_'},{c:'transparent'}]}
]},
fun:{name:'Fun',rows:[
 {l:['F1','F2','F3','F4','F5','F6'],r:['F7','F8','F9','F10','F11','F12']},
 {l:['1','2','3','4','5'],r:['6','7','8','9','0',{e:1},{e:1},{e:1}]},
 {l:[{l:M.ctrl,c:'oneshot'},{l:M.alt,c:'oneshot'},{l:M.shift,c:'oneshot'},{l:M.super,c:'oneshot'},{l:'F11'}],r:[{l:'F12'},{l:M.super,c:'oneshot'},{l:M.shift,c:'oneshot'},{l:M.alt,c:'oneshot'},{l:M.ctrl,c:'oneshot'},{e:1}]},
 {l:['F1','F2','F3','F4','F5'],r:['F6','F7','F8','F9','F10']},
 {l:[{c:'transparent'},{c:'transparent'}],r:[{l:'Caps'},{c:'transparent'}]}
]},
muggle:{name:'Muggle',rows:[
 {l:[{l:'Dim'},{l:'Bright'},{e:1},{e:1},{e:1},{e:1}],r:[{l:'Prev'},{l:'Play'},{l:'Next'},{l:'Mute'},{l:'Vol−'},{l:'Vol+'}]},
 {l:['Q','W','E','R','T'],r:['Y','U','I','O','P','[',']','\\']},
 {l:['A','S','D','F','G'],r:['H','J','K','L',';',"'"]},
 {l:['Z','X','C','V','B'],r:['N','M',',','.','/']},
 {l:[{l:'Alt'},{l:'Super'}],r:[{l:'Space'},{l:'AltGr'}]}
]}
};
function norm(k){ return (typeof k==='string')?{l:k}:k; }
function keyEl(x,y,w,h,raw){
 const k=norm(raw);
 const g=document.createElementNS(svgNS,'g');
 if(k.e){
  const r=document.createElementNS(svgNS,'rect');
  r.setAttribute('x',x);r.setAttribute('y',y);r.setAttribute('width',w);r.setAttribute('height',h);
  r.setAttribute('rx',4);r.setAttribute('fill','none');r.setAttribute('stroke','var(--border)');
  r.setAttribute('stroke-width','0.5');r.setAttribute('stroke-dasharray','2 2');r.setAttribute('opacity','0.5');
  g.appendChild(r);return g;
 }
 const cat=k.c||'normal';
 g.setAttribute('class','c-'+CATS[cat]);
 const r=document.createElementNS(svgNS,'rect');
 r.setAttribute('x',x);r.setAttribute('y',y);r.setAttribute('width',w);r.setAttribute('height',h);
 r.setAttribute('rx',4);r.setAttribute('stroke-width','0.5');
 if(cat==='transparent'){r.setAttribute('stroke-dasharray','3 2');r.setAttribute('opacity','0.55');}
 g.appendChild(r);
 const t=document.createElementNS(svgNS,'text');
 t.setAttribute('class','th');t.setAttribute('text-anchor','middle');t.setAttribute('dominant-baseline','central');
 t.setAttribute('x',x+w/2);t.setAttribute('y',k.s?y+h/2-7:y+h/2);
 t.textContent=k.l;g.appendChild(t);
 if(k.s){
  const st=document.createElementNS(svgNS,'text');
  st.setAttribute('class','ts');st.setAttribute('text-anchor','middle');st.setAttribute('dominant-baseline','central');
  st.setAttribute('x',x+w/2);st.setAttribute('y',y+h/2+9);
  st.textContent=k.s;g.appendChild(st);
 }
 return g;
}
function renderLayer(key){
 const data=LAYERS[key];
 const svg=document.createElementNS(svgNS,'svg');
 svg.setAttribute('width','100%');svg.setAttribute('viewBox','0 0 680 290');svg.setAttribute('role','img');
 const title=document.createElementNS(svgNS,'title');title.textContent=data.name+' layer key map';svg.appendChild(title);
 ROWSPECS.forEach((spec,ri)=>{
  const pitch=spec.w+5;
  const leftW=spec.l*pitch-5, rightW=spec.r*pitch-5;
  const total=leftW+30+rightW;
  const startX=40+(600-total)/2;
  const y=20+ri*50;
  const rightStart=startX+leftW+30;
  data.rows[ri].l.forEach((k,i)=>svg.appendChild(keyEl(startX+i*pitch,y,spec.w,46,k)));
  data.rows[ri].r.forEach((k,i)=>svg.appendChild(keyEl(rightStart+i*pitch,y,spec.w,46,k)));
 });
 const board=document.getElementById('board');
 board.innerHTML='';board.appendChild(svg);
 document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.key===key));
}
const tabs=document.getElementById('tabs');
Object.keys(LAYERS).forEach((key,i)=>{
 const b=document.createElement('button');
 b.className='tab-btn'+(i===0?' active':'');
 b.textContent=LAYERS[key].name;b.dataset.key=key;
 b.onclick=()=>renderLayer(key);
 tabs.appendChild(b);
});
renderLayer('def');
const LEGEND=[['amber','One-shot modifier'],['teal','Homerow mod'],['purple','Hyper key'],['green','Macro / shortcut'],['coral','Layer-hold key'],['gray','Transparent (dashed)']];
const legend=document.getElementById('legend');
LEGEND.forEach(([ramp,label])=>{
 const item=document.createElement('div');
 item.style.cssText='display:flex;align-items:center;gap:6px';
 const s=document.createElementNS(svgNS,'svg');
 s.setAttribute('width','14');s.setAttribute('height','14');s.setAttribute('viewBox','0 0 14 14');
 const rect=document.createElementNS(svgNS,'rect');
 rect.setAttribute('x','0.5');rect.setAttribute('y','0.5');rect.setAttribute('width','13');rect.setAttribute('height','13');
 rect.setAttribute('rx','3');rect.setAttribute('class','c-'+ramp);rect.setAttribute('stroke-width','0.5');
 s.appendChild(rect);
 const span=document.createElement('span');span.textContent=label;
 item.appendChild(s);item.appendChild(span);legend.appendChild(item);
});
const COMBOS=[
 ['W+E+R  /  U+I+O','Esc'],['W+R  /  U+O','Tab'],['S+D+F  /  J+K+L','Enter'],['S+F  /  J+L','Backspace'],
 ['D+K','Caps word'],['M + , + .','Toggle Num layer'],['G+H','Reload config'],['Q+W+E+R','Toggle Muggle mode']
];
const combos=document.getElementById('combos');
COMBOS.forEach(([chord,result])=>{
 const row=document.createElement('div');
 row.style.cssText='display:flex;align-items:center;gap:8px;padding:8px 10px;border:0.5px solid var(--border);border-radius:8px';
 row.innerHTML='<span style="font-family:var(--font-mono);font-size:12px;color:var(--text-secondary)">'+chord+'</span>'+
  '<i class="ti ti-arrow-right" style="font-size:14px;color:var(--text-muted)" aria-hidden="true"></i>'+
  '<span style="font-size:13px;font-weight:500;color:var(--text-accent)">'+result+'</span>';
 combos.appendChild(row);
});
</script>
